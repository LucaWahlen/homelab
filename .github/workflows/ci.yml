name: CI

on:  # yamllint disable-line rule:truthy
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@v4

      - name: Build devcontainer image
        uses: docker/build-push-action@v7
        with:
          context: .devcontainer
          load: true
          tags: devcontainer
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Root because the checkout belongs to the runner user, not the image's vscode user.
      - name: Lint
        run: docker run --rm --user root --volume "$PWD":/work --workdir /work devcontainer make -k lint
