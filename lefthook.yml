min_version: 2.0.0

pre-commit:
  parallel: true
  commands:
    yamllint:
      run: yamllint --strict .
    shellcheck:
      run: shellcheck {staged_files}
      glob: "*.sh"
    tofu:
      run: |
        set -e
        tofu fmt -check -recursive opentofu
        for s in opentofu/*/; do
          tofu -chdir="$s" init -backend=false -input=false -lockfile=readonly >/dev/null
          tofu -chdir="$s" validate
        done
      glob: "opentofu/**"
    sops:
      run: scripts/check-sops.sh
      glob: "kubernetes/**"
    tofu-state:
      run: scripts/check-tofu-state.sh
      glob: "opentofu/**"

pre-push:
  parallel: true
  commands:
    gitleaks:
      run: gitleaks git --redact --no-banner
    ansible-lint:
      root: ansible
      run: ansible-lint
      glob: "ansible/**"
    kubernetes:
      run: scripts/kubernetes-lint.sh
      glob: "kubernetes/**"
