apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: shale
  namespace: flux-system
spec:
  interval: 60m
  retryInterval: 5m
  path: ./kubernetes/apps/shale
  prune: false
  wait: false
  sourceRef:
    kind: GitRepository
    name: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age
