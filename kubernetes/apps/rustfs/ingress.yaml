apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: rustfs-console
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    traefik.ingress.kubernetes.io/router.middlewares: rustfs-redirect-https@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - rustfs.internal.lucawahlen.com
      secretName: rustfs-console-tls
  rules:
    - host: rustfs.internal.lucawahlen.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: rustfs-svc
                port:
                  name: console
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: rustfs-s3
spec:
  ingressClassName: traefik
  rules:
    - host: s3.lucawahlen.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: rustfs-svc
                port:
                  name: endpoint
