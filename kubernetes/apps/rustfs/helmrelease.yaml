apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: rustfs
  namespace: rustfs
spec:
  interval: 1h
  chart:
    spec:
      chart: rustfs
      version: "1.0.4"
      sourceRef:
        kind: HelmRepository
        name: rustfs
  values:
    mode:
      standalone:
        enabled: true
      distributed:
        enabled: false
    replicaCount: 1
    secret:
      existingSecret: rustfs-secret
    serviceAccount:
      automount: false
    config:
      rustfs:
        obs_log_directory: ""
    storageclass:
      name: local-path
      dataStorageSize: 100Gi
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 1Gi
    ingress:
      enabled: true
      className: traefik
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt
      tls:
        enabled: true
      hosts:
        - host: rustfs.internal.lucawahlen.com
          paths:
            - path: /
              pathType: Prefix
              servicePort: console
        - host: s3.lucawahlen.com
          paths:
            - path: /
              pathType: Prefix
              servicePort: endpoint
    extraEnv:
      - name: RUSTFS_BROWSER_REDIRECT_URL
        value: https://rustfs.internal.lucawahlen.com
      - name: RUSTFS_IDENTITY_OPENID_ENABLE
        value: "on"
      - name: RUSTFS_IDENTITY_OPENID_CONFIG_URL
        value: https://bedrock.lucawahlen.com/api/auth
      - name: RUSTFS_IDENTITY_OPENID_CLIENT_ID
        value: tMMvNHkucKjtTFwvYXvZLcLWulcjxpLa
      - name: RUSTFS_IDENTITY_OPENID_SCOPES
        value: openid,profile,email,roles
      - name: RUSTFS_IDENTITY_OPENID_REDIRECT_URI
        value: https://rustfs.internal.lucawahlen.com/rustfs/admin/v3/oidc/callback/default
      - name: RUSTFS_IDENTITY_OPENID_REDIRECT_URI_DYNAMIC
        value: "off"
      - name: RUSTFS_IDENTITY_OPENID_DISPLAY_NAME
        value: Bedrock
      - name: RUSTFS_IDENTITY_OPENID_GROUPS_CLAIM
        value: urn:bedrock:roles
      - name: RUSTFS_IDENTITY_OPENID_CLAIM_NAME
        value: urn:bedrock:roles
      - name: RUSTFS_IDENTITY_OPENID_ROLES_CLAIM
        value: urn:bedrock:roles
      - name: RUSTFS_IDENTITY_OPENID_EMAIL_CLAIM
        value: email
      - name: RUSTFS_IDENTITY_OPENID_USERNAME_CLAIM
        value: preferred_username
