apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: rustfs
spec:
  interval: 1h
  chart:
    spec:
      chart: rustfs
      version: "1.0.4"
      sourceRef:
        kind: HelmRepository
        name: rustfs
  install:
    crds: Create
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  values:
    mode:
      standalone:
        enabled: true
      distributed:
        enabled: false
    replicaCount: 1
    secret:
      existingSecret: rustfs-secret
    serviceAccount:
      automount: false
    config:
      rustfs:
        obs_log_directory: ""
    storageclass:
      name: openebs-lvm
      dataStorageSize: 10Gi
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 1Gi
    # Defined in ingress.yaml: the chart puts both hosts behind one TLS ingress,
    # but s3.lucawahlen.com arrives as plain HTTP from the tunnel and must not
    # get the HTTPS redirect the internal console needs.
    ingress:
      enabled: false
    extraEnv:
      - name: RUSTFS_BROWSER_REDIRECT_URL
        value: https://rustfs.internal.lucawahlen.com
      - name: RUSTFS_IDENTITY_OPENID_ENABLE
        value: "on"
      - name: RUSTFS_IDENTITY_OPENID_CONFIG_URL
        value: https://bedrock.lucawahlen.com/api/auth
      - name: RUSTFS_IDENTITY_OPENID_CLIENT_ID
        value: tMMvNHkucKjtTFwvYXvZLcLWulcjxpLa
      - name: RUSTFS_IDENTITY_OPENID_SCOPES
        value: openid,profile,email,roles
      - name: RUSTFS_IDENTITY_OPENID_REDIRECT_URI
        value: https://rustfs.internal.lucawahlen.com/rustfs/admin/v3/oidc/callback/default
      - name: RUSTFS_IDENTITY_OPENID_REDIRECT_URI_DYNAMIC
        value: "off"
      - name: RUSTFS_IDENTITY_OPENID_DISPLAY_NAME
        value: Bedrock
      - name: RUSTFS_IDENTITY_OPENID_GROUPS_CLAIM
        value: urn:bedrock:roles
      - name: RUSTFS_IDENTITY_OPENID_CLAIM_NAME
        value: urn:bedrock:roles
      - name: RUSTFS_IDENTITY_OPENID_ROLES_CLAIM
        value: urn:bedrock:roles
      - name: RUSTFS_IDENTITY_OPENID_EMAIL_CLAIM
        value: email
      # Bedrock signs email/name into the ID token but never preferred_username,
      # so the default leaves the username empty and the Console falls back to
      # showing a derived identity hash instead of a name.
      - name: RUSTFS_IDENTITY_OPENID_USERNAME_CLAIM
        value: email
