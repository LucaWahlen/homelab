apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: bedrock-db
  labels:
    app: bedrock-db
spec:
  serviceName: bedrock-db
  replicas: 1
  selector:
    matchLabels:
      app: bedrock-db
  template:
    metadata:
      labels:
        app: bedrock-db
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          # Postgres 18 keeps PGDATA under /var/lib/postgresql, not /data.
          image: postgres:18.6-alpine
          env:
            - name: POSTGRES_DB
              value: bedrock
            - name: POSTGRES_USER
              value: bedrock
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: bedrock-secrets
                  key: POSTGRES_PASSWORD
          ports:
            - name: postgres
              containerPort: 5432
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "bedrock", "-d", "bedrock"]
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "bedrock", "-d", "bedrock"]
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 5
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql
            - name: run
              mountPath: /var/run/postgresql
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
        annotations:
          kustomize.toolkit.fluxcd.io/prune: disabled
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: local-path
        resources:
          requests:
            storage: 5Gi
