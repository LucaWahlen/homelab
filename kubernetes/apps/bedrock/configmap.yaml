apiVersion: v1
kind: ConfigMap
metadata:
  name: bedrock-config
data:
  # Public https URL: the OIDC issuer and passkey relying party. Pick it once.
  BETTER_AUTH_URL: https://bedrock.lucawahlen.com

  SEED_ADMIN_EMAIL: admin@lucawahlen.com
  SEED_ADMIN_NAME: Admin

  # Cloudflare R2. Public reads use the bucket's custom domain.
  S3_REGION: auto
  S3_BUCKET: bedrock-media
  S3_ENDPOINT: https://918313ddac1a5febb3798b7630b4b7d4.r2.cloudflarestorage.com
  S3_FORCE_PATH_STYLE: "true"
  S3_PUBLIC_URL: https://bedrock-media.lucawahlen.com

  # Resend speaks SMTP: port 587 negotiates STARTTLS.
  EMAIL_SENDER_NAME: Bedrock
  EMAIL_SENDER_ADDRESS: bedrock@mail.lucawahlen.com
  SMTP_HOST: smtp.resend.com
  SMTP_PORT: "587"
  SMTP_SECURE: "false"

  # OpenTelemetry. Metrics go to VictoriaMetrics, request spans to
  # VictoriaTraces; the base endpoint is what the health page checks.
  OTEL_EXPORTER_OTLP_ENDPOINT: http://vmsingle-monitoring-victoria-metrics-k8s-stack.monitoring.svc.cluster.local:8428/opentelemetry
  OTEL_EXPORTER_OTLP_METRICS_ENDPOINT: http://vmsingle-monitoring-victoria-metrics-k8s-stack.monitoring.svc.cluster.local:8428/opentelemetry/v1/metrics
  OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://vtsingle-monitoring-victoria-metrics-k8s-stack.monitoring.svc.cluster.local:10428/insert/opentelemetry/v1/traces
  OTEL_SERVICE_NAME: bedrock

  PWNED_PASSWORD_CHECK: "true"
  AUDIT_RETENTION_DAYS: "90"
  ORGANIZATION_RETENTION_DAYS: "30"
