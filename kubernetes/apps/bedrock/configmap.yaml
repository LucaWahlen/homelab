apiVersion: v1
kind: ConfigMap
metadata:
  name: bedrock-config
data:
  # Public https URL: the OIDC issuer and passkey relying party. Pick it once.
  BETTER_AUTH_URL: https://bedrock.lucawahlen.com

  SEED_ADMIN_EMAIL: mail@lucawahlen.com
  SEED_ADMIN_NAME: Luca Wahlen

  # RustFS (self-hosted). Public reads go through the s3.lucawahlen.com
  # ingress with an anonymous-read bucket policy.
  S3_REGION: us-east-1
  S3_BUCKET: bedrock-media
  S3_ENDPOINT: https://s3.lucawahlen.com
  S3_FORCE_PATH_STYLE: "true"
  S3_PUBLIC_URL: https://s3.lucawahlen.com/bedrock-media

  # maddy on mail.lucawahlen.com. Port 465 uses implicit TLS from the first
  # byte, so SMTP_SECURE is true. The matching account comes from maddy's
  # SOPS-managed credentials file; the password is in the bedrock secret.
  EMAIL_SENDER_NAME: Bedrock
  EMAIL_SENDER_ADDRESS: bedrock@mail.lucawahlen.com
  SMTP_HOST: mail.lucawahlen.com
  SMTP_PORT: "465"
  SMTP_SECURE: "true"

  PWNED_PASSWORD_CHECK: "true"
  AUDIT_RETENTION_DAYS: "90"
  ORGANIZATION_RETENTION_DAYS: "30"
