apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bedrock
spec:
  ingressClassName: traefik
  rules:
    - host: bedrock.lucawahlen.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: bedrock
                port:
                  number: 3000
