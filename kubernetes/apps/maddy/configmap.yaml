apiVersion: v1
kind: ConfigMap
metadata:
  name: maddy-config
data:
  # Send-only maddy: an authenticated submission server that DKIM-signs mail
  # and relays it to remote MX. There is no inbound SMTP, no IMAP and no
  # mailbox storage, so the workload is stateless (the only "disk" is a
  # memory-backed emptyDir holding the delivery queue and TLS/DKIM caches).
  #
  # The whole server configuration is this file, so it is managed by Git.
  # The mail domain is the mail.lucawahlen.com subdomain; the root domain stays
  # on Proton.
  #
  # maddy listens on unprivileged ports in the container (8465 implicit TLS,
  # 8587 STARTTLS) because the official image runs as root and carries no
  # NET_BIND_SERVICE file capability. The Service maps 465/587 onto them.
  maddy.conf: |
    $(hostname) = mail.lucawahlen.com
    $(primary_domain) = mail.lucawahlen.com
    $(local_domains) = $(primary_domain)

    state_dir /data
    runtime_dir /run/maddy

    # Issued by cert-manager (DNS-01). maddy reloads this from disk on
    # renewal, so no restart is needed after a certificate change.
    tls file /etc/maddy/tls/tls.crt /etc/maddy/tls/tls.key

    # Sender credentials ("user:bcrypt:$2a$...") read from a file that is
    # mounted from the SOPS-encrypted maddy-secrets Secret.
    auth.pass_table local_authdb {
        table file /etc/maddy/secret/credentials
    }

    hostname $(hostname)

    # Submission only. 8465 uses implicit TLS from the first byte (Bedrock
    # uses this); 8587 is STARTTLS.
    submission tls://0.0.0.0:8465 tcp://0.0.0.0:8587 {
        limits {
            all rate 50 1s
        }

        auth &local_authdb

        # Only senders at our own domain, and the envelope/From must match the
        # authenticated account. Everything else is rejected.
        source $(local_domains) {
            check {
                authorize_sender {
                    user_to_email identity
                }
            }

            default_destination {
                modify {
                    dkim $(primary_domain) $(local_domains) default
                }
                deliver_to &remote_queue
            }
        }
        default_source {
            reject 501 5.1.8 "Non-local sender domain"
        }
    }

    target.remote outbound_delivery {
        limits {
            destination rate 20 1s
            destination concurrency 10
        }
        mx_auth {
            dane
            mtasts {
                cache fs
                fs_dir mtasts_cache/
            }
            local_policy {
                min_tls_level encrypted
                min_mx_level none
            }
        }
    }

    # Retries within the pod's lifetime, entirely in memory (emptyDir backed by
    # tmpfs). No bounce block: with no mailbox there is nowhere to deliver a
    # DSN, so none is generated. To drop retries and fail the SMTP transaction
    # instead, replace "deliver_to &remote_queue" above with
    # "deliver_to &outbound_delivery".
    target.queue remote_queue {
        target &outbound_delivery
        autogenerated_msg_domain $(primary_domain)
    }
