apiVersion: v1
kind: ConfigMap
metadata:
  name: maddy-config
data:
  # The whole mail server configuration is this file, so it is entirely
  # managed by Git. Runtime state (mailboxes, queue, DKIM material) lives on
  # the data volume; credentials are mounted from a SOPS-encrypted Secret.
  #
  # The mail domain is the mail.lucawahlen.com subdomain. The root domain
  # stays on Proton.
  #
  # maddy listens on unprivileged ports in the container (8025/8465/8587/8993)
  # because the official image runs as root and carries no NET_BIND_SERVICE
  # file capability, so it cannot bind 25/465/587/993 as a non-root user. The
  # Services map the real ports onto these targetPorts.
  maddy.conf: |
    $(hostname) = mail.lucawahlen.com
    $(primary_domain) = mail.lucawahlen.com
    $(local_domains) = $(primary_domain)

    state_dir /data
    runtime_dir /run/maddy

    # Issued by cert-manager (DNS-01). maddy reloads this from disk on
    # renewal, so no restart is needed after a certificate change.
    tls file /etc/maddy/tls/tls.crt /etc/maddy/tls/tls.key

    # Credentials are hashes ("user:bcrypt:$2a$...") read from a file that is
    # mounted from the SOPS-encrypted maddy-secrets Secret, so the user
    # database is declarative and lives in Git.
    auth.pass_table local_authdb {
        table file /etc/maddy/secret/credentials
    }

    storage.imapsql local_mailboxes {
        driver sqlite3
        dsn imapsql.db
    }

    hostname $(hostname)

    table.chain local_rewrites {
        optional_step static {
            entry postmaster postmaster@$(primary_domain)
        }
        optional_step file /etc/maddy/aliases
    }

    msgpipeline local_routing {
        destination postmaster $(local_domains) {
            modify {
                replace_rcpt &local_rewrites
            }

            deliver_to &local_mailboxes
        }

        default_destination {
            reject 550 5.1.1 "User doesn't exist"
        }
    }

    # Port 25 (listens on 8025 here). Rejects the local domains so they can
    # only send through submission.
    smtp tcp://0.0.0.0:8025 {
        limits {
            all rate 20 1s
            all concurrency 10
        }

        dmarc yes
        check {
            require_mx_record
            dkim
            spf
        }

        source $(local_domains) {
            reject 501 5.1.8 "Use Submission for outgoing SMTP"
        }
        default_source {
            destination postmaster $(local_domains) {
                deliver_to &local_routing
            }
            default_destination {
                reject 550 5.1.1 "User doesn't exist"
            }
        }
    }

    # Submission. 8465 uses implicit TLS from the first byte (Bedrock uses
    # this); 8587 is STARTTLS.
    submission tls://0.0.0.0:8465 tcp://0.0.0.0:8587 {
        limits {
            all rate 50 1s
        }

        auth &local_authdb

        source $(local_domains) {
            check {
                authorize_sender {
                    prepare_email &local_rewrites
                    user_to_email identity
                }
            }

            destination postmaster $(local_domains) {
                deliver_to &local_routing
            }
            default_destination {
                modify {
                    dkim $(primary_domain) $(local_domains) default
                }
                deliver_to &remote_queue
            }
        }
        default_source {
            reject 501 5.1.8 "Non-local sender domain"
        }
    }

    target.remote outbound_delivery {
        limits {
            destination rate 20 1s
            destination concurrency 10
        }
        mx_auth {
            dane
            mtasts {
                cache fs
                fs_dir mtasts_cache/
            }
            local_policy {
                min_tls_level encrypted
                min_mx_level none
            }
        }
    }

    target.queue remote_queue {
        target &outbound_delivery

        autogenerated_msg_domain $(primary_domain)
        bounce {
            destination postmaster $(local_domains) {
                deliver_to &local_routing
            }
            default_destination {
                reject 550 5.0.0 "Refusing to send DSNs to non-local addresses"
            }
        }
    }

    # IMAP. 8993 is implicit TLS; 8143 is cleartext and not published.
    imap tls://0.0.0.0:8993 tcp://0.0.0.0:8143 {
        auth &local_authdb
        storage &local_mailboxes
    }
  # Local aliases, one "key: value" per line. See maddy table.file docs.
  aliases: |
    # redacted@example.com: redacted@example.com
