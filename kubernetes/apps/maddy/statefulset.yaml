apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: maddy
  labels:
    app: maddy
spec:
  serviceName: maddy-headless
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: maddy
  template:
    metadata:
      labels:
        app: maddy
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 60
      # Absolute lookups first: maddy resolves MX hosts and MTA-STS endpoints,
      # and the default ndots:5 wastes a search-domain round trip per name.
      dnsConfig:
        options:
          - name: ndots
            value: "1"
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # maddy keeps authentication credentials and IMAP storage accounts
        # separate, and only the former is declarative (the mounted
        # credentials file). This derives the mailbox list from those
        # usernames and creates the missing storage accounts before the
        # server starts, so both stay driven by Git.
        - name: ensure-accounts
          image: foxcpp/maddy:0.9.6
          command:
            - /bin/sh
            - -c
          args:
            - |
              set -eu
              cfg=/etc/maddy/maddy.conf
              maddy -config "$cfg" imap-acct list > /tmp/have.raw 2>/dev/null || true
              sort -u /tmp/have.raw > /tmp/have
              grep -vE '^[[:space:]]*(#|$)' /etc/maddy/secret/credentials \
                | cut -d: -f1 | sort -u > /tmp/want
              comm -23 /tmp/want /tmp/have > /tmp/to-create
              while IFS= read -r acct; do
                [ -n "$acct" ] || continue
                echo "creating IMAP account: $acct"
                maddy -config "$cfg" imap-acct create "$acct"
              done < /tmp/to-create
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: config
              mountPath: /etc/maddy/maddy.conf
              subPath: maddy.conf
              readOnly: true
            - name: config
              mountPath: /etc/maddy/aliases
              subPath: aliases
              readOnly: true
            - name: secret
              mountPath: /etc/maddy/secret
              readOnly: true
            - name: dkim
              mountPath: /data/dkim_keys/mail.lucawahlen.com_default.key
              subPath: dkim.key
              readOnly: true
            - name: tls
              mountPath: /etc/maddy/tls
              readOnly: true
            - name: data
              mountPath: /data
            - name: run
              mountPath: /run/maddy
            - name: tmp
              mountPath: /tmp
      containers:
        - name: maddy
          image: foxcpp/maddy:0.9.6
          # The image entrypoint points at /data/maddy.conf; override it so the
          # Git-managed ConfigMap is authoritative and /data is state only.
          command:
            - /bin/maddy
          args:
            - -config
            - /etc/maddy/maddy.conf
            - run
          ports:
            - name: smtp
              containerPort: 8025
            - name: smtps
              containerPort: 8465
            - name: submission
              containerPort: 8587
            - name: imaps
              containerPort: 8993
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            tcpSocket:
              port: imaps
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: smtp
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: config
              mountPath: /etc/maddy/maddy.conf
              subPath: maddy.conf
              readOnly: true
            - name: config
              mountPath: /etc/maddy/aliases
              subPath: aliases
              readOnly: true
            - name: secret
              mountPath: /etc/maddy/secret
              readOnly: true
            - name: dkim
              mountPath: /data/dkim_keys/mail.lucawahlen.com_default.key
              subPath: dkim.key
              readOnly: true
            - name: tls
              mountPath: /etc/maddy/tls
              readOnly: true
            - name: data
              mountPath: /data
            - name: run
              mountPath: /run/maddy
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: maddy-config
        - name: secret
          secret:
            secretName: maddy-secrets
            items:
              - key: credentials
                path: credentials
        # The DKIM private key is a SOPS-managed Secret, mounted read-only at
        # the path maddy's default "dkim <domain> <domains> default" expects.
        # Because the key exists, maddy reads it instead of generating a new
        # one, so signing stays reproducible from Git.
        - name: dkim
          secret:
            secretName: maddy-secrets
            items:
              - key: dkim.key
                path: dkim.key
        - name: tls
          secret:
            secretName: maddy-mail-tls
        - name: run
          emptyDir:
            sizeLimit: 16Mi
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
  volumeClaimTemplates:
    - metadata:
        name: data
        annotations:
          kustomize.toolkit.fluxcd.io/prune: disabled
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: openebs-lvm
        resources:
          requests:
            storage: 20Gi
