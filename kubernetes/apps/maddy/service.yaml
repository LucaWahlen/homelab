# Published submission ports. k3s ServiceLB binds these on the node; forward
# 465 (and 587 if you use it) from the FritzBox to the node's LAN address. The
# container listens on unprivileged ports, so the targetPorts differ. There is
# no port 25: this server only sends.
apiVersion: v1
kind: Service
metadata:
  name: maddy-mail
  labels:
    app: maddy
spec:
  type: LoadBalancer
  # Keep the client IP so maddy can rate-limit/ban and log real sources.
  externalTrafficPolicy: Local
  selector:
    app: maddy
  ports:
    - name: smtps
      port: 465
      targetPort: smtps
    - name: submission
      port: 587
      targetPort: submission
