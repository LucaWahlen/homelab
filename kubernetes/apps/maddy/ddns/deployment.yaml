apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflare-ddns
  labels:
    app: cloudflare-ddns
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: cloudflare-ddns
  template:
    metadata:
      labels:
        app: cloudflare-ddns
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: cloudflare-ddns
          image: favonia/cloudflare-ddns:1
          env:
            - name: CLOUDFLARE_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: maddy-secrets
                  key: CLOUDFLARE_API_TOKEN
            - name: DOMAINS
              value: mail.lucawahlen.com
            # Cloudflare proxy does not carry SMTP traffic.
            - name: PROXIED
              value: "false"
            - name: IP4_PROVIDER
              value: cloudflare.trace
            # IPv4 only; dynamic IPv6 prefixes lack a matching PTR record.
            - name: IP6_PROVIDER
              value: none
            - name: UPDATE_CRON
              value: "@every 5m"
            - name: TZ
              value: Europe/Berlin
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
