apiVersion: operator.victoriametrics.com/v1beta1
kind: VMPodScrape
metadata:
  name: blocky
spec:
  namespaceSelector:
    matchNames:
      - blocky
  selector:
    matchLabels:
      app: blocky
  podMetricsEndpoints:
    - port: http
      # A fixed job label, so the Blocky dashboard can select blocky's Go and
      # process metrics without a job dropdown.
      relabelConfigs:
        - targetLabel: job
          replacement: blocky
