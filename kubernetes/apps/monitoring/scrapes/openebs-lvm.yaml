apiVersion: operator.victoriametrics.com/v1beta1
kind: VMServiceScrape
metadata:
  name: openebs-lvm
spec:
  namespaceSelector:
    matchNames:
      - openebs
  selector:
    matchLabels:
      openebs.io/component-name: openebs-lvm-node
  endpoints:
    - port: metrics
      relabelConfigs:
        - targetLabel: job
          replacement: openebs-lvm
