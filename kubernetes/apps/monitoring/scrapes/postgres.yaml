apiVersion: operator.victoriametrics.com/v1beta1
kind: VMPodScrape
metadata:
  name: postgres
spec:
  namespaceSelector:
    matchNames:
      - postgres
  selector:
    matchLabels:
      cnpg.io/cluster: postgres
  podMetricsEndpoints:
    - port: metrics
      relabelConfigs:
        - targetLabel: job
          replacement: postgres
---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMPodScrape
metadata:
  name: postgres-backup
spec:
  namespaceSelector:
    matchNames:
      - postgres
  selector:
    matchLabels:
      app: postgres-backup-exporter
  podMetricsEndpoints:
    - port: metrics
      interval: 1m
      scrapeTimeout: 30s
      relabelConfigs:
        - targetLabel: job
          replacement: postgres-backup
