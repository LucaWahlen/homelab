apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# disableNameSuffixHash updates ConfigMaps in place so the Grafana sidecar reloads without deleting.
configMapGenerator:
  - name: grafana-dashboard-victoriametrics-single-node
    files:
      - victoriametrics-single-node.json
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "1"
  - name: grafana-dashboard-vmagent
    files:
      - vmagent.json
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "1"
  - name: grafana-dashboard-victorialogs
    files:
      - victorialogs.json
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "1"
  - name: grafana-dashboard-vlagent
    files:
      - vlagent.json
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "1"
  - name: grafana-dashboard-k8s-views-global
    files:
      - k8s-views-global.json
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "1"
  - name: grafana-dashboard-k8s-views-namespaces
    files:
      - k8s-views-namespaces.json
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "1"
  - name: grafana-dashboard-k8s-views-nodes
    files:
      - k8s-views-nodes.json
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "1"
  - name: grafana-dashboard-k8s-views-pods
    files:
      - k8s-views-pods.json
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "1"
  - name: grafana-dashboard-storage
    files:
      - storage.json
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "1"
  - name: grafana-dashboard-blocky
    files:
      - blocky.json
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "1"
  - name: grafana-dashboard-cloudnative-pg
    files:
      - cloudnative-pg.json
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "1"
