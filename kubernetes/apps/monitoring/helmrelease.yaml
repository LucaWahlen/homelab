apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: monitoring
spec:
  interval: 1h
  chart:
    spec:
      chart: victoria-metrics-k8s-stack
      version: "0.95.2"
      sourceRef:
        kind: HelmRepository
        name: victoriametrics
  install:
    crds: Create
  upgrade:
    crds: CreateReplace
  values:
    # --- Metrics -------------------------------------------------------
    vmsingle:
      spec:
        retentionPeriod: 14d
        storage:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 20Gi

    # --- Logs ----------------------------------------------------------
    vlsingle:
      enabled: true
      spec:
        retentionPeriod: 14d
        # local-path PVs are unquota'd directories on the node disk, so cap the
        # log store and drop the oldest partitions before the node fills up.
        # https://docs.victoriametrics.com/victorialogs/#absolute-disk-space-limit
        extraArgs:
          retention.maxDiskSpaceUsageBytes: "16GiB"
        storage:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 20Gi
    vlagent:
      enabled: true
      spec:
        k8sCollector:
          enabled: true

    # --- Alerting disabled for now ------------------------------------
    alertmanager:
      enabled: false
    vmalert:
      enabled: false
    defaultRules:
      enabled: false

    # Dashboards are vendored in this repo (dashboards/), not fetched at deploy time.
    defaultDashboards:
      enabled: false
    syncJob:
      enabled: false

    # k3s has no separate etcd/controller-manager/scheduler to scrape.
    kubeEtcd:
      enabled: false
    kubeControllerManager:
      enabled: false
    kubeScheduler:
      enabled: false

    # --- Velero custom resource metrics -------------------------------
    # kube-state-metrics turns Velero objects into metrics so the dashboard
    # can show per-backup, per-app and per-storage-location detail. The Velero
    # server only exposes the metadata tarball size and availability gauges,
    # while volume bytes and object phases live on the objects themselves.
    kube-state-metrics:
      rbac:
        extraRules:
          - apiGroups: ["velero.io"]
            resources: ["backups", "podvolumebackups", "backupstoragelocations", "schedules"]
            verbs: ["list", "watch"]
      customResourceState:
        enabled: true
        config:
          kind: CustomResourceStateMetrics
          spec:
            resources:
              - groupVersionKind:
                  group: velero.io
                  version: v1
                  kind: Backup
                metricNamePrefix: kube
                labelsFromPath:
                  backup: [metadata, name]
                  namespace: [metadata, namespace]
                  schedule: [metadata, labels, "velero.io/schedule-name"]
                  storage_location: [spec, storageLocation]
                  phase: [status, phase]
                metrics:
                  - name: velero_backup_items_backed_up
                    help: "Number of items backed up by Velero"
                    each:
                      type: Gauge
                      gauge:
                        path: [status, progress, itemsBackedUp]
                  - name: velero_backup_items_total
                    help: "Total number of items to be backed up"
                    each:
                      type: Gauge
                      gauge:
                        path: [status, progress, totalItems]
                  - name: velero_backup_items_attempted_total
                    help: "Number of item backup operations attempted"
                    each:
                      type: Gauge
                      gauge:
                        path: [status, backupItemOperationsAttempted]
                  - name: velero_backup_items_completed_total
                    help: "Number of item backup operations completed"
                    each:
                      type: Gauge
                      gauge:
                        path: [status, backupItemOperationsCompleted]
                  - name: velero_backup_items_failed_total
                    help: "Number of item backup operations that failed"
                    each:
                      type: Gauge
                      gauge:
                        path: [status, backupItemOperationsFailed]
                  - name: velero_backup_errors
                    help: "Number of errors encountered during the backup"
                    each:
                      type: Gauge
                      gauge:
                        path: [status, errors]
                  - name: velero_backup_warnings
                    help: "Number of warnings encountered during the backup"
                    each:
                      type: Gauge
                      gauge:
                        path: [status, warnings]
                  - name: velero_backup_volume_snapshots_attempted
                    help: "Number of volume snapshots attempted"
                    each:
                      type: Gauge
                      gauge:
                        path: [status, volumeSnapshotsAttempted]
                  - name: velero_backup_volume_snapshots_completed
                    help: "Number of volume snapshots completed"
                    each:
                      type: Gauge
                      gauge:
                        path: [status, volumeSnapshotsCompleted]
                  - name: velero_backup_csi_snapshots_attempted
                    help: "Number of CSI volume snapshots attempted"
                    each:
                      type: Gauge
                      gauge:
                        path: [status, csiVolumeSnapshotsAttempted]
                  - name: velero_backup_csi_snapshots_completed
                    help: "Number of CSI volume snapshots completed"
                    each:
                      type: Gauge
                      gauge:
                        path: [status, csiVolumeSnapshotsCompleted]
                  - name: velero_backup_start_timestamp
                    help: "Velero backup start time, Unix timestamp in seconds"
                    each:
                      type: Gauge
                      gauge:
                        path: [status, startTimestamp]
                  - name: velero_backup_completion_timestamp
                    help: "Velero backup completion time, Unix timestamp in seconds"
                    errorLogV: 10
                    each:
                      type: Gauge
                      gauge:
                        path: [status, completionTimestamp]
                  - name: velero_backup_expiration_timestamp
                    help: "Velero backup expiration time, Unix timestamp in seconds"
                    errorLogV: 10
                    each:
                      type: Gauge
                      gauge:
                        path: [status, expiration]
                  - name: velero_backup_validation_errors
                    help: "Validation error messages for the backup"
                    errorLogV: 10
                    each:
                      type: Info
                      info:
                        path: [status, validationErrors]
                        labelsFromPath:
                          error: []
              - groupVersionKind:
                  group: velero.io
                  version: v1
                  kind: PodVolumeBackup
                metricNamePrefix: kube
                labelsFromPath:
                  backup: [metadata, labels, "velero.io/backup-name"]
                  app_namespace: [spec, pod, namespace]
                  pod: [spec, pod, name]
                  volume: [spec, volume]
                  storage_location: [spec, backupStorageLocation]
                  node: [spec, node]
                  uploader: [spec, uploaderType]
                  phase: [status, phase]
                metrics:
                  - name: velero_podvolumebackup_total_bytes
                    help: "Total bytes of a Velero pod volume backup"
                    each:
                      type: Gauge
                      gauge:
                        path: [status, progress, totalBytes]
                  - name: velero_podvolumebackup_bytes_done
                    help: "Bytes already uploaded for a Velero pod volume backup"
                    each:
                      type: Gauge
                      gauge:
                        path: [status, progress, bytesDone]
                  - name: velero_podvolumebackup_incremental_bytes
                    help: "Incremental bytes uploaded for a Velero pod volume backup"
                    errorLogV: 10
                    each:
                      type: Gauge
                      gauge:
                        path: [status, incrementalBytes]
                  - name: velero_podvolumebackup_start_timestamp
                    help: "Pod volume backup start time, Unix timestamp in seconds"
                    each:
                      type: Gauge
                      gauge:
                        path: [status, startTimestamp]
                  - name: velero_podvolumebackup_accepted_timestamp
                    help: "Pod volume backup accepted time, Unix timestamp in seconds"
                    errorLogV: 10
                    each:
                      type: Gauge
                      gauge:
                        path: [status, acceptedTimestamp]
                  - name: velero_podvolumebackup_completion_timestamp
                    help: "Pod volume backup completion time, Unix timestamp in seconds"
                    errorLogV: 10
                    each:
                      type: Gauge
                      gauge:
                        path: [status, completionTimestamp]
              - groupVersionKind:
                  group: velero.io
                  version: v1
                  kind: BackupStorageLocation
                metricNamePrefix: kube
                labelsFromPath:
                  storage_location: [metadata, name]
                  phase: [status, phase]
                  provider: [spec, provider]
                  access_mode: [status, accessMode]
                metrics:
                  - name: velero_backupstoragelocation_last_validation_timestamp
                    help: "Last time the backup storage location was validated, Unix timestamp in seconds"
                    errorLogV: 10
                    each:
                      type: Gauge
                      gauge:
                        path: [status, lastValidationTime]
                  - name: velero_backupstoragelocation_last_synced_timestamp
                    help: "Last time the backup storage location was synced, Unix timestamp in seconds"
                    errorLogV: 10
                    each:
                      type: Gauge
                      gauge:
                        path: [status, lastSyncedTime]
                  - name: velero_backupstoragelocation_default
                    help: "Whether this is the default backup storage location (1) or not (0)"
                    each:
                      type: Gauge
                      gauge:
                        path: [spec, default]
              - groupVersionKind:
                  group: velero.io
                  version: v1
                  kind: Schedule
                metricNamePrefix: kube
                labelsFromPath:
                  schedule: [metadata, name]
                  namespace: [metadata, namespace]
                  cron: [spec, schedule]
                  phase: [status, phase]
                metrics:
                  - name: velero_schedule_paused
                    help: "Whether the schedule is paused (1) or not (0)"
                    errorLogV: 10
                    each:
                      type: Gauge
                      gauge:
                        path: [spec, paused]
                  - name: velero_schedule_use_owner_references
                    help: "Whether backups created by this schedule use owner references (1) or not (0)"
                    errorLogV: 10
                    each:
                      type: Gauge
                      gauge:
                        path: [spec, useOwnerReferencesInBackup]
                  - name: velero_schedule_last_backup_timestamp
                    help: "Time of the last backup created by the schedule, Unix timestamp in seconds"
                    errorLogV: 10
                    each:
                      type: Gauge
                      gauge:
                        path: [status, lastBackup]
                  - name: velero_schedule_last_skipped_timestamp
                    help: "Time the last backup was skipped by the schedule, Unix timestamp in seconds"
                    errorLogV: 10
                    each:
                      type: Gauge
                      gauge:
                        path: [status, lastSkipped]
                  - name: velero_schedule_validation_errors
                    help: "Validation error messages for the schedule"
                    errorLogV: 10
                    each:
                      type: Info
                      info:
                        path: [status, validationErrors]
                        labelsFromPath:
                          error: []

    # --- Grafana -------------------------------------------------------
    grafana:
      admin:
        existingSecret: grafana-admin
      # VictoriaLogs datasource plugin (the VictoriaMetrics datasource is built in).
      plugins:
        - victoriametrics-logs-datasource
      grafana.ini:
        server:
          root_url: https://grafana.internal.lucawahlen.com
        users:
          allow_sign_up: false
      # Alerting provisioning is mounted from a SOPS-encrypted Secret so the
      # ntfy access token stays out of this HelmRelease.
      extraSecretMounts:
        - name: ntfy-contactpoints
          secretName: grafana-ntfy-alerting
          mountPath: /etc/grafana/provisioning/alerting/contactpoints.yaml
          subPath: contactpoints.yaml
          readOnly: true
        - name: ntfy-policies
          secretName: grafana-ntfy-alerting
          mountPath: /etc/grafana/provisioning/alerting/policies.yaml
          subPath: policies.yaml
          readOnly: true
        - name: ntfy-templates
          secretName: grafana-ntfy-alerting
          mountPath: /etc/grafana/provisioning/alerting/templates.yaml
          subPath: templates.yaml
          readOnly: true
      # Dummy alert rule to exercise the ntfy contact point. It evaluates the
      # built-in expression datasource (always 1 > 0) and so fires continuously;
      # delete this group once you've confirmed push delivery.
      alerting:
        rules.yaml:
          apiVersion: 1
          groups:
            - orgId: 1
              name: dummy
              folder: Alerts
              interval: 1m
              rules:
                - uid: dummy-always-firing
                  title: Dummy alert (always firing)
                  condition: C
                  data:
                    - refId: A
                      datasourceUid: __expr__
                      relativeTimeRange:
                        from: 600
                        to: 0
                      model:
                        datasource:
                          type: __expr__
                          uid: __expr__
                        expression: "1"
                        intervalMs: 1000
                        maxDataPoints: 43200
                        refId: A
                        type: math
                    - refId: B
                      datasourceUid: __expr__
                      model:
                        datasource:
                          type: __expr__
                          uid: __expr__
                        expression: A
                        intervalMs: 1000
                        maxDataPoints: 43200
                        reducer: last
                        refId: B
                        type: reduce
                    - refId: C
                      datasourceUid: __expr__
                      model:
                        datasource:
                          type: __expr__
                          uid: __expr__
                        expression: B
                        intervalMs: 1000
                        maxDataPoints: 43200
                        refId: C
                        type: threshold
                        conditions:
                          - evaluator:
                              params:
                                - 0
                              type: gt
                            operator:
                              type: and
                            query:
                              params:
                                - C
                            reducer:
                              params: []
                              type: last
                            type: query
                  noDataState: OK
                  execErrState: OK
                  for: 0s
                  annotations:
                    summary: Test notification from Grafana to ntfy
                  labels:
                    severity: test
      persistence:
        enabled: true
        storageClassName: local-path
        size: 1Gi
        annotations:
          helm.sh/resource-policy: keep
      ingress:
        enabled: true
        ingressClassName: traefik
        annotations:
          cert-manager.io/cluster-issuer: letsencrypt
          traefik.ingress.kubernetes.io/router.middlewares: monitoring-redirect-https@kubernetescrd
        hosts:
          - grafana.internal.lucawahlen.com
        tls:
          - secretName: grafana-tls
            hosts:
              - grafana.internal.lucawahlen.com
