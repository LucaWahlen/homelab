apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: monitoring
spec:
  interval: 1h
  chart:
    spec:
      chart: victoria-metrics-k8s-stack
      version: "0.95.2"
      sourceRef:
        kind: HelmRepository
        name: victoriametrics
  install:
    crds: Create
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  values:
    vmsingle:
      spec:
        retentionPeriod: 90d
        # Stop ingesting before the shared node disk fills up.
        extraArgs:
          storage.minFreeDiskSpaceBytes: "5GiB"
        storage:
          storageClassName: openebs-lvm
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 10Gi
        resources:
          requests:
            cpu: 50m
            memory: 512Mi
          limits:
            cpu: 1000m
            memory: 1Gi
    vlsingle:
      enabled: true
      spec:
        retentionPeriod: 30d
        # Drop oldest log partitions when reaching 2GiB.
        extraArgs:
          retention.maxDiskSpaceUsageBytes: "2GiB"
        storage:
          storageClassName: openebs-lvm
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 2Gi
        resources:
          requests:
            cpu: 50m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 768Mi
    vlagent:
      enabled: true
      spec:
        resources:
          requests:
            cpu: 25m
            memory: 64Mi
          limits:
            cpu: 250m
            memory: 192Mi
        k8sCollector:
          enabled: true
    vmagent:
      spec:
        resources:
          requests:
            cpu: 50m
            memory: 192Mi
          limits:
            cpu: 500m
            memory: 384Mi
    alertmanager:
      enabled: false
    vmalert:
      enabled: false
    defaultRules:
      enabled: false
    defaultDashboards:
      enabled: false
    syncJob:
      enabled: false
    kube-state-metrics:
      resources:
        requests:
          cpu: 25m
          memory: 64Mi
        limits:
          cpu: 200m
          memory: 192Mi
    prometheus-node-exporter:
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          cpu: 100m
          memory: 96Mi
    victoria-metrics-operator:
      resources:
        requests:
          cpu: 25m
          memory: 128Mi
        limits:
          cpu: 200m
          memory: 256Mi
    # k3s embeds these components; no separate endpoints exist to scrape.
    kubeEtcd:
      enabled: false
    kubeControllerManager:
      enabled: false
    kubeScheduler:
      enabled: false
    grafana:
      replicas: 1
      resources:
        requests:
          cpu: 50m
          memory: 512Mi
        limits:
          cpu: 500m
          memory: 1Gi
      # RWO volume cannot be mounted by two pods; null clears the chart's default rollingUpdate block.
      deploymentStrategy:
        type: Recreate
        rollingUpdate: null
      admin:
        existingSecret: grafana-admin
      smtp:
        existingSecret: grafana-smtp
        userKey: user
        passwordKey: password
      plugins:
        - victoriametrics-logs-datasource
      env:
        TZ: Europe/Berlin
        GF_AUTH_DISABLE_LOGIN_FORM: "true"
        GF_AUTH_GENERIC_OAUTH_ENABLED: "true"
        GF_AUTH_GENERIC_OAUTH_AUTO_LOGIN: "true"
        GF_AUTH_GENERIC_OAUTH_NAME: Bedrock
        GF_AUTH_GENERIC_OAUTH_CLIENT_ID: PwlcvpdcoGZNAQQONkaCKgPrMAcMidtt
        GF_AUTH_GENERIC_OAUTH_SCOPES: openid profile email roles
        GF_AUTH_GENERIC_OAUTH_AUTH_URL: https://bedrock.lucawahlen.com/api/auth/oauth2/authorize
        GF_AUTH_GENERIC_OAUTH_TOKEN_URL: https://bedrock.lucawahlen.com/api/auth/oauth2/token
        GF_AUTH_GENERIC_OAUTH_API_URL: https://bedrock.lucawahlen.com/api/auth/oauth2/userinfo
        GF_AUTH_GENERIC_OAUTH_USE_PKCE: "true"
        # Enforces the access token's 1h expiry so revoked Bedrock roles take effect.
        GF_AUTH_GENERIC_OAUTH_USE_REFRESH_TOKEN: "true"
        GF_AUTH_GENERIC_OAUTH_ALLOW_SIGN_UP: "true"
        GF_AUTH_GENERIC_OAUTH_ALLOW_ASSIGN_GRAFANA_ADMIN: "true"
        GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_STRICT: "true"
        GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_PATH: >-
          contains("urn:bedrock:roles", 'grafana-admin') && 'GrafanaAdmin' ||
          contains("urn:bedrock:roles", 'grafana-developer') && 'Editor' ||
          contains("urn:bedrock:roles", 'grafana-viewer') && 'Viewer' || 'None'
      envValueFrom:
        ALERT_EMAIL:
          secretKeyRef:
            name: grafana-smtp
            key: alert_email
      envFromSecret: grafana-oidc
      grafana.ini:
        smtp:
          enabled: true
          host: mail.lucawahlen.com:465
          from_address: grafana@mail.lucawahlen.com
          from_name: Grafana
          # Port 465 uses implicit TLS from the first byte.
          startTLS_policy: NoStartTLS
        feature_toggles:
          enable: grafana.visualDesignRefresh
        server:
          root_url: https://grafana.internal.lucawahlen.com
        users:
          allow_sign_up: false
        date_formats:
          default_timezone: Europe/Berlin
        plugins:
          disable_plugins: grafana-exploretraces-app,grafana-pyroscope-app,grafana-advisor-app,alertmanager,cloudwatch,elasticsearch,grafana-azure-monitor-datasource,grafana-postgresql-datasource,grafana-pyroscope-datasource,grafana-testdata-datasource,graphite,influxdb,jaeger,loki,mssql,mysql,opentsdb,stackdriver,tempo,zipkin  # yamllint disable-line rule:line-length
      alerting:
        contactpoints.yaml:
          apiVersion: 1
          contactPoints:
            - orgId: 1
              name: grafana-email
              receivers:
                - uid: grafana-email
                  type: email
                  settings:
                    addresses: $ALERT_EMAIL
                    singleEmail: false
        policies.yaml:
          apiVersion: 1
          policies:
            - orgId: 1
              receiver: grafana-email
              group_by:
                - grafana_folder
                - alertname
              group_wait: 30s
              group_interval: 5m
              repeat_interval: 4h
        delete-contactpoints.yaml:
          apiVersion: 1
          deleteContactPoints:
            - orgId: 1
              uid: ntfy-alerts
      persistence:
        enabled: true
        storageClassName: openebs-lvm
        size: 1Gi
        annotations:
          helm.sh/resource-policy: keep
      ingress:
        enabled: true
        ingressClassName: traefik
        annotations:
          cert-manager.io/cluster-issuer: letsencrypt
          traefik.ingress.kubernetes.io/router.middlewares: monitoring-redirect-https@kubernetescrd
        hosts:
          - grafana.internal.lucawahlen.com
        tls:
          - secretName: grafana-tls
            hosts:
              - grafana.internal.lucawahlen.com
