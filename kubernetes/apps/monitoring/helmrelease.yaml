apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: monitoring
spec:
  interval: 1h
  chart:
    spec:
      chart: victoria-metrics-k8s-stack
      version: "0.95.2"
      sourceRef:
        kind: HelmRepository
        name: victoriametrics
  install:
    crds: Create
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
      remediateLastFailure: true
  values:
    # --- Metrics -------------------------------------------------------
    vmsingle:
      spec:
        # 90d keeps ~a quarter of metric history.
        retentionPeriod: 90d
        # VM has no hard size cap (unlike VictoriaLogs); instead stop ingesting
        # before the shared node disk fills up.
        extraArgs:
          storage.minFreeDiskSpaceBytes: "5GiB"
        storage:
          storageClassName: openebs-lvm
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 10Gi

    # --- Logs ----------------------------------------------------------
    vlsingle:
      enabled: true
      spec:
        retentionPeriod: 30d
        # Cap the log store and drop the oldest partitions before the volume
        # fills up, independent of the PVC request size.
        # https://docs.victoriametrics.com/victorialogs/#absolute-disk-space-limit
        extraArgs:
          retention.maxDiskSpaceUsageBytes: "2GiB"
        storage:
          storageClassName: openebs-lvm
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 2Gi
    vlagent:
      enabled: true
      spec:
        k8sCollector:
          enabled: true

    # --- Alerting disabled for now ------------------------------------
    alertmanager:
      enabled: false
    vmalert:
      enabled: false
    defaultRules:
      enabled: false

    # Dashboards are vendored in this repo (dashboards/), not fetched at deploy time.
    defaultDashboards:
      enabled: false
    syncJob:
      enabled: false

    # k3s has no separate etcd/controller-manager/scheduler to scrape.
    kubeEtcd:
      enabled: false
    kubeControllerManager:
      enabled: false
    kubeScheduler:
      enabled: false

    # --- Grafana -------------------------------------------------------
    grafana:
      replicas: 1
      # The data volume is a single-mount LVM volume (RWO), so a rolling update
      # deadlocks: the new pod cannot mount the device while the old pod holds
      # it. Recreate tears the old pod down before starting the new one.
      deploymentStrategy:
        type: Recreate
      admin:
        existingSecret: grafana-admin
      # VictoriaLogs datasource plugin (the VictoriaMetrics datasource is built in).
      plugins:
        - victoriametrics-logs-datasource
      # Honor the grafana_folder annotation on dashboard ConfigMaps so the
      # sidecar files dashboards into folders instead of all landing in General.
      sidecar:
        dashboards:
          folderAnnotation: grafana_folder
          provider:
            foldersFromFilesStructure: true
      # Whole instance in Berlin local time.
      env:
        TZ: Europe/Berlin
        # --- Bedrock OIDC (generic OAuth) ------------------------------
        # Sign-in is delegated to Bedrock; Grafana maps the namespaced roles
        # claim to its own roles. The client secret is not here: it lives in
        # the SOPS-encrypted Secret loaded through envFromSecret below.
        GF_AUTH_GENERIC_OAUTH_ENABLED: "true"
        GF_AUTH_GENERIC_OAUTH_NAME: Bedrock
        GF_AUTH_GENERIC_OAUTH_CLIENT_ID: PwlcvpdcoGZNAQQONkaCKgPrMAcMidtt
        GF_AUTH_GENERIC_OAUTH_SCOPES: openid profile email roles
        GF_AUTH_GENERIC_OAUTH_AUTH_URL: https://bedrock.lucawahlen.com/api/auth/oauth2/authorize
        GF_AUTH_GENERIC_OAUTH_TOKEN_URL: https://bedrock.lucawahlen.com/api/auth/oauth2/token
        GF_AUTH_GENERIC_OAUTH_API_URL: https://bedrock.lucawahlen.com/api/auth/oauth2/userinfo
        GF_AUTH_GENERIC_OAUTH_USE_PKCE: "true"
        # Roles are only mapped at sign-in. Bedrock issues no refresh token to
        # Grafana, so this signs the user out when the one-hour access token
        # expires, and the next sign-in maps whatever roles they hold then.
        GF_AUTH_GENERIC_OAUTH_USE_REFRESH_TOKEN: "true"
        GF_AUTH_GENERIC_OAUTH_ALLOW_SIGN_UP: "true"
        GF_AUTH_GENERIC_OAUTH_ALLOW_ASSIGN_GRAFANA_ADMIN: "true"
        # Deny a token that carries no recognised Grafana role, and map the
        # Grafana-scoped role keys (Granted through a group) to Grafana roles.
        GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_STRICT: "true"
        GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_PATH: >-
          contains("urn:bedrock:roles", 'grafana-admin') && 'GrafanaAdmin' ||
          contains("urn:bedrock:roles", 'grafana-developer') && 'Editor' ||
          contains("urn:bedrock:roles", 'grafana-viewer') && 'Viewer' || 'None'
      # Grafana OIDC client secret, encrypted with SOPS/age.
      envFromSecret: grafana-oidc
      grafana.ini:
        server:
          root_url: https://grafana.internal.lucawahlen.com
        users:
          allow_sign_up: false
        date_formats:
          default_timezone: Europe/Berlin
        # Keep only what this stack uses: the Prometheus (VictoriaMetrics) and
        # VictoriaLogs datasources plus the Metrics/Logs Drilldown apps. Traces
        # and Profiles have no backend here, and the bundled datasources below
        # are all unused.
        plugins:
          disable_plugins: grafana-exploretraces-app,grafana-pyroscope-app,grafana-advisor-app,alertmanager,cloudwatch,elasticsearch,grafana-azure-monitor-datasource,grafana-postgresql-datasource,grafana-pyroscope-datasource,grafana-testdata-datasource,graphite,influxdb,jaeger,loki,mssql,mysql,opentsdb,stackdriver,tempo,zipkin  # yamllint disable-line rule:line-length
      persistence:
        enabled: true
        storageClassName: openebs-lvm
        size: 1Gi
        annotations:
          helm.sh/resource-policy: keep
      ingress:
        enabled: true
        ingressClassName: traefik
        annotations:
          cert-manager.io/cluster-issuer: letsencrypt
          traefik.ingress.kubernetes.io/router.middlewares: monitoring-redirect-https@kubernetescrd
        hosts:
          - grafana.internal.lucawahlen.com
        tls:
          - secretName: grafana-tls
            hosts:
              - grafana.internal.lucawahlen.com
