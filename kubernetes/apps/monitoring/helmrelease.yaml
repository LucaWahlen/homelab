apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: monitoring
spec:
  interval: 1h
  chart:
    spec:
      chart: victoria-metrics-k8s-stack
      version: "0.95.2"
      sourceRef:
        kind: HelmRepository
        name: victoriametrics
  install:
    crds: Create
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
      remediateLastFailure: true
  values:
    # --- Metrics -------------------------------------------------------
    vmsingle:
      spec:
        # 90d keeps ~a quarter of history (enough for monthly Cloudflare/R2 use).
        retentionPeriod: 90d
        # VM has no hard size cap (unlike VictoriaLogs); instead stop ingesting
        # before the shared node disk fills up.
        extraArgs:
          storage.minFreeDiskSpaceBytes: "5GiB"
        storage:
          storageClassName: openebs-lvm
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 10Gi

    # --- Logs ----------------------------------------------------------
    vlsingle:
      enabled: true
      spec:
        retentionPeriod: 30d
        # Cap the log store and drop the oldest partitions before the volume
        # fills up, independent of the PVC request size.
        # https://docs.victoriametrics.com/victorialogs/#absolute-disk-space-limit
        extraArgs:
          retention.maxDiskSpaceUsageBytes: "2GiB"
        storage:
          storageClassName: openebs-lvm
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 2Gi
    vlagent:
      enabled: true
      spec:
        k8sCollector:
          enabled: true

    # --- Alerting disabled for now ------------------------------------
    alertmanager:
      enabled: false
    vmalert:
      enabled: false
    defaultRules:
      enabled: false

    # Dashboards are vendored in this repo (dashboards/), not fetched at deploy time.
    defaultDashboards:
      enabled: false
    syncJob:
      enabled: false

    # k3s has no separate etcd/controller-manager/scheduler to scrape.
    kubeEtcd:
      enabled: false
    kubeControllerManager:
      enabled: false
    kubeScheduler:
      enabled: false

    # --- Grafana -------------------------------------------------------
    grafana:
      replicas: 1
      admin:
        existingSecret: grafana-admin
      # VictoriaLogs datasource plugin (the VictoriaMetrics datasource is built in).
      plugins:
        - victoriametrics-logs-datasource
      # Honor the grafana_folder annotation on dashboard ConfigMaps so the
      # sidecar files dashboards into folders instead of all landing in General.
      sidecar:
        dashboards:
          folderAnnotation: grafana_folder
          provider:
            foldersFromFilesStructure: true
      # Whole instance in Berlin local time.
      env:
        TZ: Europe/Berlin
        # --- Bedrock OIDC (generic OAuth) ------------------------------
        # Sign-in is delegated to Bedrock; Grafana maps the namespaced roles
        # claim to its own roles. The client secret is not here: it lives in
        # the SOPS-encrypted Secret loaded through envFromSecret below.
        GF_AUTH_GENERIC_OAUTH_ENABLED: "true"
        GF_AUTH_GENERIC_OAUTH_NAME: Bedrock
        GF_AUTH_GENERIC_OAUTH_CLIENT_ID: PwlcvpdcoGZNAQQONkaCKgPrMAcMidtt
        GF_AUTH_GENERIC_OAUTH_SCOPES: openid profile email roles
        GF_AUTH_GENERIC_OAUTH_AUTH_URL: https://bedrock.lucawahlen.com/api/auth/oauth2/authorize
        GF_AUTH_GENERIC_OAUTH_TOKEN_URL: https://bedrock.lucawahlen.com/api/auth/oauth2/token
        GF_AUTH_GENERIC_OAUTH_API_URL: https://bedrock.lucawahlen.com/api/auth/oauth2/userinfo
        GF_AUTH_GENERIC_OAUTH_USE_PKCE: "true"
        # Roles are only mapped at sign-in. Bedrock issues no refresh token to
        # Grafana, so this signs the user out when the one-hour access token
        # expires, and the next sign-in maps whatever roles they hold then.
        GF_AUTH_GENERIC_OAUTH_USE_REFRESH_TOKEN: "true"
        GF_AUTH_GENERIC_OAUTH_ALLOW_SIGN_UP: "true"
        GF_AUTH_GENERIC_OAUTH_ALLOW_ASSIGN_GRAFANA_ADMIN: "true"
        # Deny a token that carries no recognised Grafana role, and map the
        # Grafana-scoped role keys (Granted through a group) to Grafana roles.
        GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_STRICT: "true"
        GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_PATH: >-
          contains("urn:bedrock:roles", 'grafana-admin') && 'GrafanaAdmin' ||
          contains("urn:bedrock:roles", 'grafana-developer') && 'Editor' ||
          contains("urn:bedrock:roles", 'grafana-viewer') && 'Viewer' || 'None'
      # Grafana OIDC client secret, encrypted with SOPS/age.
      envFromSecret: grafana-oidc
      grafana.ini:
        server:
          root_url: https://grafana.internal.lucawahlen.com
        users:
          allow_sign_up: false
        date_formats:
          default_timezone: Europe/Berlin
        # Keep only what this stack uses: the Prometheus (VictoriaMetrics) and
        # VictoriaLogs datasources plus the Metrics/Logs Drilldown apps. Traces
        # and Profiles have no backend here, and the bundled datasources below
        # are all unused.
        plugins:
          disable_plugins: grafana-exploretraces-app,grafana-pyroscope-app,grafana-advisor-app,alertmanager,cloudwatch,elasticsearch,grafana-azure-monitor-datasource,grafana-postgresql-datasource,grafana-pyroscope-datasource,grafana-testdata-datasource,graphite,influxdb,jaeger,loki,mssql,mysql,opentsdb,stackdriver,tempo,zipkin  # yamllint disable-line rule:line-length
      # Alerting provisioning is mounted from a SOPS-encrypted Secret so the
      # ntfy access token stays out of this HelmRelease.
      extraSecretMounts:
        - name: ntfy-contactpoints
          secretName: grafana-ntfy-alerting
          mountPath: /etc/grafana/provisioning/alerting/contactpoints.yaml
          subPath: contactpoints.yaml
          readOnly: true
        - name: ntfy-policies
          secretName: grafana-ntfy-alerting
          mountPath: /etc/grafana/provisioning/alerting/policies.yaml
          subPath: policies.yaml
          readOnly: true
        - name: ntfy-templates
          secretName: grafana-ntfy-alerting
          mountPath: /etc/grafana/provisioning/alerting/templates.yaml
          subPath: templates.yaml
          readOnly: true
      # R2 free-tier alerts. "usage" fires on actual rolling-30d consumption;
      # "projection" fires when the 7-day average daily rate extrapolates to a
      # full-month total over the tier. Both route to the ntfy contact point via
      # the default notification policy.
      alerting:
        rules.yaml:
          apiVersion: 1
          groups:
            - orgId: 1
              name: cloudflare-r2
              folder: Cloudflare
              interval: 1h
              rules:
                - uid: r2-class-a-usage
                  title: R2 Class A above daily share of the monthly free tier
                  condition: B
                  data:
                    - refId: A
                      datasourceUid: VictoriaMetrics
                      relativeTimeRange:
                        from: 21600
                        to: 0
                      model:
                        datasource:
                          type: prometheus
                          uid: VictoriaMetrics
                        editorMode: code
                        expr: >-
                          (sum(cloudflare_r2_operation_count) -
                          sum(cloudflare_r2_operation_count{operation=~"Get.*|Head.*"})) / (1000000 / days_in_month())
                        instant: true
                        refId: A
                    - refId: B
                      datasourceUid: __expr__
                      model:
                        datasource:
                          type: __expr__
                          uid: __expr__
                        expression: A
                        refId: B
                        type: threshold
                        conditions:
                          - evaluator:
                              params:
                                - 1
                              type: gt
                            operator:
                              type: and
                            query:
                              params:
                                - B
                            reducer:
                              type: last
                            type: query
                  noDataState: OK
                  execErrState: OK
                  for: 1h
                  annotations:
                    summary: R2 Class A operations today exceed the daily share (1M / days this month) of the monthly free tier.
                  labels:
                    severity: warning
                    ntfy_topic: cloudflare
                - uid: r2-class-b-usage
                  title: R2 Class B above daily share of the monthly free tier
                  condition: B
                  data:
                    - refId: A
                      datasourceUid: VictoriaMetrics
                      relativeTimeRange:
                        from: 21600
                        to: 0
                      model:
                        datasource:
                          type: prometheus
                          uid: VictoriaMetrics
                        editorMode: code
                        expr: >-
                          sum(cloudflare_r2_operation_count{operation=~"Get.*|Head.*"}) / (10000000 / days_in_month())
                        instant: true
                        refId: A
                    - refId: B
                      datasourceUid: __expr__
                      model:
                        datasource:
                          type: __expr__
                          uid: __expr__
                        expression: A
                        refId: B
                        type: threshold
                        conditions:
                          - evaluator:
                              params:
                                - 1
                              type: gt
                            operator:
                              type: and
                            query:
                              params:
                                - B
                            reducer:
                              type: last
                            type: query
                  noDataState: OK
                  execErrState: OK
                  for: 1h
                  annotations:
                    summary: R2 Class B operations today exceed the daily share (10M / days this month) of the monthly free tier.
                  labels:
                    severity: warning
                    ntfy_topic: cloudflare
                - uid: r2-class-a-projection
                  title: R2 Class A projected to exceed monthly free tier
                  condition: B
                  data:
                    - refId: A
                      datasourceUid: VictoriaMetrics
                      relativeTimeRange:
                        from: 21600
                        to: 0
                      model:
                        datasource:
                          type: prometheus
                          uid: VictoriaMetrics
                        editorMode: code
                        expr: >-
                          sum(avg_over_time((max_over_time((sum(cloudflare_r2_operation_count) -
                          sum(cloudflare_r2_operation_count{operation=~"Get.*|Head.*"}))[1d]))[7d:1d])) *
                          days_in_month()
                        instant: true
                        refId: A
                    - refId: B
                      datasourceUid: __expr__
                      model:
                        datasource:
                          type: __expr__
                          uid: __expr__
                        expression: A
                        refId: B
                        type: threshold
                        conditions:
                          - evaluator:
                              params:
                                - 1000000
                              type: gt
                            operator:
                              type: and
                            query:
                              params:
                                - B
                            reducer:
                              type: last
                            type: query
                  noDataState: OK
                  execErrState: OK
                  for: 1h
                  annotations:
                    summary: R2 Class A is projected to exceed the 1M monthly free tier at the current daily rate.
                  labels:
                    severity: warning
                    ntfy_topic: cloudflare
                - uid: r2-class-b-projection
                  title: R2 Class B projected to exceed monthly free tier
                  condition: B
                  data:
                    - refId: A
                      datasourceUid: VictoriaMetrics
                      relativeTimeRange:
                        from: 21600
                        to: 0
                      model:
                        datasource:
                          type: prometheus
                          uid: VictoriaMetrics
                        editorMode: code
                        expr: >-
                          sum(avg_over_time((max_over_time((
                          sum(cloudflare_r2_operation_count{operation=~"Get.*|Head.*"}))[1d]))[7d:1d])) *
                          days_in_month()
                        instant: true
                        refId: A
                    - refId: B
                      datasourceUid: __expr__
                      model:
                        datasource:
                          type: __expr__
                          uid: __expr__
                        expression: A
                        refId: B
                        type: threshold
                        conditions:
                          - evaluator:
                              params:
                                - 10000000
                              type: gt
                            operator:
                              type: and
                            query:
                              params:
                                - B
                            reducer:
                              type: last
                            type: query
                  noDataState: OK
                  execErrState: OK
                  for: 1h
                  annotations:
                    summary: R2 Class B is projected to exceed the 10M monthly free tier at the current daily rate.
                  labels:
                    severity: warning
                    ntfy_topic: cloudflare
      persistence:
        enabled: true
        storageClassName: openebs-lvm
        size: 1Gi
        annotations:
          helm.sh/resource-policy: keep
      ingress:
        enabled: true
        ingressClassName: traefik
        annotations:
          cert-manager.io/cluster-issuer: letsencrypt
          traefik.ingress.kubernetes.io/router.middlewares: monitoring-redirect-https@kubernetescrd
        hosts:
          - grafana.internal.lucawahlen.com
        tls:
          - secretName: grafana-tls
            hosts:
              - grafana.internal.lucawahlen.com
