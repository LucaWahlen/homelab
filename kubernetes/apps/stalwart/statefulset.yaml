apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: stalwart
  labels:
    app: stalwart
spec:
  serviceName: stalwart-headless
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: stalwart
  template:
    metadata:
      labels:
        app: stalwart
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 60
      # Absolute lookups first: Stalwart resolves MX hosts and ACME endpoints,
      # and the default ndots:5 wastes a search-domain round trip per name.
      dnsConfig:
        options:
          - name: ndots
            value: "1"
      securityContext:
        runAsNonRoot: true
        runAsUser: 2000
        runAsGroup: 2000
        fsGroup: 2000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: stalwart
          image: stalwartlabs/stalwart:v1
          args:
            - --config
            - /etc/stalwart/config.json
          env:
            # The WebUI identifies itself with a client metadata document at
            # this URL. It must match the host the browser uses, otherwise
            # sign-in fails with "Client metadata documents are disabled".
            - name: STALWART_PUBLIC_URL
              value: https://mail.lucawahlen.com
          envFrom:
            - secretRef:
                name: stalwart-env
          ports:
            - name: smtp
              containerPort: 25
            - name: smtps
              containerPort: 465
            - name: submission
              containerPort: 587
            - name: imaps
              containerPort: 993
            - name: mgmt
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
              # 25/465/587/993 are privileged ports. The image sets the file
              # capability too; the bounding set must allow it under restricted
              # Pod Security.
              add: ["NET_BIND_SERVICE"]
          readinessProbe:
            httpGet:
              path: /healthz/ready
              port: mgmt
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz/live
              port: mgmt
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: config
              mountPath: /etc/stalwart/config.json
              subPath: config.json
              readOnly: true
            - name: data
              mountPath: /var/lib/stalwart
            - name: logs
              mountPath: /var/log/stalwart
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: stalwart-config
        - name: logs
          emptyDir:
            sizeLimit: 256Mi
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
  volumeClaimTemplates:
    - metadata:
        name: data
        annotations:
          kustomize.toolkit.fluxcd.io/prune: disabled
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: openebs-lvm
        resources:
          requests:
            storage: 20Gi
