apiVersion: v1
kind: ConfigMap
metadata:
  name: stalwart-config
data:
  # Only the DataStore lives in this file. Domains, accounts, listeners, TLS
  # and routing are configuration objects stored in the database and managed
  # through the WebUI (Settings) or the JMAP API.
  config.json: |
    {
      "@type": "RocksDb",
      "path": "/var/lib/stalwart/"
    }
