# Let's Encrypt HTTP-01 for mail.lucawahlen.com. This is deliberately a plain
# HTTP Ingress: the challenge must be reachable on port 80, and only the ACME
# path is routed. Forward TCP 80 from the FritzBox to the node alongside the
# mail ports, then configure an ACME provider with challengeType Http01 in the
# Stalwart WebUI. The certificate is stored in Stalwart and renewed in place.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: stalwart-acme
spec:
  ingressClassName: traefik
  rules:
    - host: mail.lucawahlen.com
      http:
        paths:
          - path: /.well-known/acme-challenge
            pathType: Prefix
            backend:
              service:
                name: stalwart
                port:
                  name: mgmt
