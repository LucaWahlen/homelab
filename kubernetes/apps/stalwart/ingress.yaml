apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: stalwart
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - mail.lucawahlen.com
      secretName: stalwart-web-tls
  rules:
    - host: mail.lucawahlen.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: stalwart
                port:
                  name: mgmt
