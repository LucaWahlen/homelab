apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: stalwart
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    traefik.ingress.kubernetes.io/router.middlewares: stalwart-redirect-https@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - stalwart.internal.lucawahlen.com
      secretName: stalwart-tls
  rules:
    - host: stalwart.internal.lucawahlen.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: stalwart
                port:
                  name: mgmt
