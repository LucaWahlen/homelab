apiVersion: apps/v1
kind: Deployment
metadata:
  name: halite
  labels:
    app: halite
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: halite
  template:
    metadata:
      labels:
        app: halite
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: halite
          image: ghcr.io/lucawahlen/halite:v2.0.1
          envFrom:
            - configMapRef:
                name: halite-config
            - secretRef:
                name: halite-admin
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          # Allows time for Postgres to accept connections and migrations to run.
          startupProbe:
            httpGet:
              path: /api/v1/ready
              port: http
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /api/v1/ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 192Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
