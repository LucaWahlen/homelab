apiVersion: apps/v1
kind: Deployment
metadata:
  name: shale
  labels:
    app: shale
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: shale
  template:
    metadata:
      labels:
        app: shale
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: shale
          image: ghcr.io/lucawahlen/shale:v1.4.0
          env:
            - name: SHALE_DB_PATH
              value: /data/shale.db
            - name: SHALE_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: shale-admin
                  key: SHALE_ADMIN_PASSWORD
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: shale
        - name: tmp
          emptyDir: {}
