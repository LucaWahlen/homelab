apiVersion: apps/v1
kind: Deployment
metadata:
  name: shale
  labels:
    app: shale
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: shale
  template:
    metadata:
      labels:
        app: shale
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: shale
          image: ghcr.io/lucawahlen/shale:v2.0.0
          env:
            - name: SHALE_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: shale-secrets
                  key: DATABASE_URL
            - name: SHALE_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: shale-secrets
                  key: SHALE_ADMIN_PASSWORD
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          # Allow time for database migrations on first start.
          startupProbe:
            httpGet:
              path: /api/v1/health
              port: http
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            periodSeconds: 20
          resources:
            requests:
              cpu: 5m
              memory: 48Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
