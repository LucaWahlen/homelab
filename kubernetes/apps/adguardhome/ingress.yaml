apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: adguardhome
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    traefik.ingress.kubernetes.io/router.middlewares: adguardhome-redirect-https@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - adguard.internal.lucawahlen.com
      secretName: adguardhome-tls
  rules:
    - host: adguard.internal.lucawahlen.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                # All traffic enters oauth2-proxy, which signs the user in with
                # Bedrock before proxying on to the AdGuard web service.
                name: oauth2-proxy
                port:
                  number: 4180
