apiVersion: v1
kind: Service
metadata:
  name: adguardhome-dns
  labels:
    app: adguardhome
spec:
  type: LoadBalancer
  # Preserve client source IPs for AdGuard's per-client stats and rules.
  externalTrafficPolicy: Local
  selector:
    app: adguardhome
  ports:
    - name: dns-udp
      port: 53
      targetPort: dns-udp
      protocol: UDP
    - name: dns-tcp
      port: 53
      targetPort: dns-tcp
      protocol: TCP
