apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: adguardhome
resources:
  - namespace.yaml
  - pvc.yaml
  - deployment.yaml
  - service-dns.yaml
  - service-web.yaml
  - ingress.yaml
  - middleware.yaml
  # Bedrock OIDC gate: oauth2-proxy fronts the AdGuard Home UI.
  - oauth2-proxy-deployment.yaml
  - oauth2-proxy-service.yaml
  - oauth2-proxy-secret.enc.yaml
  - config.enc.yaml
configMapGenerator:
  # oauth2-proxy's environment. The generated name carries a hash of these
  # values, so changing any of them rolls the pod.
  - name: oauth2-proxy-config
    literals:
      # Gate the AdGuard Home UI with Bedrock. oauth2-proxy terminates every
      # request, signs the user in through Bedrock's OIDC provider, then proxies the
      # rest to the AdGuard web service. The client id and secret live in
      # oauth2-proxy-secret.enc.yaml.
      - OAUTH2_PROXY_PROVIDER=oidc
      - OAUTH2_PROXY_PROVIDER_DISPLAY_NAME=Bedrock
      - OAUTH2_PROXY_OIDC_ISSUER_URL=https://bedrock.lucawahlen.com/api/auth
      # Gate on the roles claim, not the groups claim: Bedrock roles are individual
      # per application (adguard-*), and a Bedrock group bundles a set of them.
      - OAUTH2_PROXY_SCOPE=openid profile email roles
      - OAUTH2_PROXY_OIDC_GROUPS_CLAIM=urn:bedrock:roles
      # Bedrock requires PKCE; without this oauth2-proxy's authorize request is
      # refused with invalid_request.
      - OAUTH2_PROXY_CODE_CHALLENGE_METHOD=S256
      # The gate is binary: this role only means "may reach AdGuard at all", so it
      # has no tiers. Which group grants it is what decides who gets in.
      - OAUTH2_PROXY_ALLOWED_GROUPS=adguard-access
      - OAUTH2_PROXY_EMAIL_DOMAINS=*
      - OAUTH2_PROXY_REDIRECT_URL=https://adguard.internal.lucawahlen.com/oauth2/callback
      - OAUTH2_PROXY_UPSTREAMS=http://adguardhome-web:3000
      - OAUTH2_PROXY_HTTP_ADDRESS=0.0.0.0:4180
      - OAUTH2_PROXY_COOKIE_SECURE=true
      # The session cookie carries the roles from sign-in and is never rechecked
      # against Bedrock, so its lifetime is how long a revoked role keeps working.
      # Signing in again is silent while the Bedrock session lasts.
      - OAUTH2_PROXY_COOKIE_EXPIRE=1h
      - OAUTH2_PROXY_COOKIE_SAMESITE=lax
      - OAUTH2_PROXY_REVERSE_PROXY=true
      - OAUTH2_PROXY_TRUSTED_PROXY_IPS=10.42.0.0/16,10.43.0.0/16
      - OAUTH2_PROXY_SET_XAUTHREQUEST=true
      - OAUTH2_PROXY_PASS_USER_HEADERS=true
      - OAUTH2_PROXY_SKIP_PROVIDER_BUTTON=true
      - OAUTH2_PROXY_WHITELIST_DOMAINS=.internal.lucawahlen.com
