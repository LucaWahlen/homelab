apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: adguardhome
resources:
  - namespace.yaml
  - pvc.yaml
  - deployment.yaml
  - service-dns.yaml
  - service-web.yaml
  - ingress.yaml
  - middleware.yaml
  # Bedrock OIDC gate: oauth2-proxy fronts the AdGuard Home UI.
  - oauth2-proxy-configmap.yaml
  - oauth2-proxy-deployment.yaml
  - oauth2-proxy-service.yaml
  - oauth2-proxy-secret.enc.yaml
  - config.enc.yaml
