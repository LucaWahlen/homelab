apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
  namespace: cert-manager
spec:
  interval: 1h
  chart:
    spec:
      chart: cert-manager
      version: "1.21.2"
      sourceRef:
        kind: HelmRepository
        name: cert-manager
  install:
    crds: Create
  upgrade:
    crds: CreateReplace
  values:
    crds:
      enabled: true
      keep: true
    # Bypass split-horizon rewrites for *.internal when checking DNS-01 propagation.
    extraArgs:
      - --dns01-recursive-nameservers-only
      - --dns01-recursive-nameservers=1.1.1.1:53,9.9.9.9:53
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
