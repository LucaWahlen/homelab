apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - clusterissuer.yaml
helmCharts:
  - name: cert-manager
    repo: https://charts.jetstack.io
    version: 1.21.2
    releaseName: cert-manager
    namespace: cert-manager
    valuesInline:
      crds:
        enabled: true
        keep: true
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
generators:
  - ksops.yaml
