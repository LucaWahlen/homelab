apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: pgadmin
resources:
  - namespace.yaml
  - pvc.yaml
  - deployment.yaml
  - service.yaml
  - middleware.yaml
  - ingress.yaml
  - secret.enc.yaml
# Hashed name: a config change rolls the pod, which pgAdmin needs to reload it.
configMapGenerator:
  - name: pgadmin-config
    files:
      - config_system.py
