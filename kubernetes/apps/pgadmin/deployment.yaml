apiVersion: apps/v1
kind: Deployment
metadata:
  name: pgadmin
  labels:
    app: pgadmin
spec:
  replicas: 1
  # /var/lib/pgadmin holds the SQLite config DB and sessions on an RWO volume, so
  # the old pod must terminate before the new one starts.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: pgadmin
  template:
    metadata:
      labels:
        app: pgadmin
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 5050
        runAsGroup: 5050
        fsGroup: 5050
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: pgadmin
          image: dpage/pgadmin4:9.19.0
          env:
            - name: PGADMIN_DEFAULT_EMAIL
              valueFrom:
                secretKeyRef:
                  name: pgadmin-secret
                  key: PGADMIN_DEFAULT_EMAIL
            - name: PGADMIN_DEFAULT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pgadmin-secret
                  key: PGADMIN_DEFAULT_PASSWORD
            # Listen above 1024 so the container never needs NET_BIND_SERVICE and
            # allowPrivilegeEscalation can stay off.
            - name: PGADMIN_LISTEN_PORT
              value: "8080"
            # No local mail relay in the cluster.
            - name: PGADMIN_DISABLE_POSTFIX
              value: "1"
            # Don't call out to the pgAdmin release server on every startup.
            - name: PGADMIN_CONFIG_UPGRADE_CHECK_ENABLED
              value: "False"
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /misc/ping
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /misc/ping
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 5
          securityContext:
            allowPrivilegeEscalation: false
            # The entrypoint rewrites /pgadmin4/config_distro.py at startup, so
            # the root filesystem cannot be mounted read-only.
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 128Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/pgadmin
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: pgadmin
        - name: tmp
          emptyDir: {}
