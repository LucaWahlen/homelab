apiVersion: apps/v1
kind: Deployment
metadata:
  name: pgadmin
  labels:
    app: pgadmin
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: pgadmin
  template:
    metadata:
      labels:
        app: pgadmin
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 5050
        runAsGroup: 5050
        fsGroup: 5050
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: pgadmin
          image: dpage/pgadmin4:9.19.0
          env:
            # Required on first boot to initialize the SQLite DB; password login is disabled in config_system.py.
            - name: PGADMIN_DEFAULT_EMAIL
              valueFrom:
                secretKeyRef:
                  name: pgadmin-secret
                  key: PGADMIN_DEFAULT_EMAIL
            - name: PGADMIN_DEFAULT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pgadmin-secret
                  key: PGADMIN_DEFAULT_PASSWORD
            - name: OAUTH2_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: pgadmin-secret
                  key: OAUTH2_CLIENT_SECRET
            - name: PGADMIN_LISTEN_PORT
              value: "8080"
            - name: PGADMIN_DISABLE_POSTFIX
              value: "1"
            - name: PGADMIN_CONFIG_UPGRADE_CHECK_ENABLED
              value: "False"
            - name: PGADMIN_SERVER_JSON_FILE
              value: /etc/pgadmin-servers/servers.json
            # True would recreate the server with a new ID on every restart, breaking per-user state.
            - name: PGADMIN_REPLACE_SERVERS_ON_STARTUP
              value: "False"
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /misc/ping
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /misc/ping
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 5
          securityContext:
            allowPrivilegeEscalation: false
            # Entrypoint rewrites /pgadmin4/config_distro.py at startup.
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 256Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/pgadmin
            - name: tmp
              mountPath: /tmp
            - name: config
              mountPath: /etc/pgadmin
              readOnly: true
            - name: servers
              mountPath: /etc/pgadmin-servers
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: pgadmin
        - name: tmp
          emptyDir: {}
        - name: config
          configMap:
            name: pgadmin-config
            items:
              - key: config_system.py
                path: config_system.py
        - name: servers
          configMap:
            name: pgadmin-config
            items:
              - key: servers.json
                path: servers.json
