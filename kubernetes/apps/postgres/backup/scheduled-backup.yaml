apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: postgres-daily
spec:
  # CloudNativePG cron has a seconds field: 02:00:00 UTC every day.
  schedule: "0 0 2 * * *"
  # Take the first base backup as soon as this object is applied, instead of
  # waiting for the first 02:00 window.
  immediate: true
  # Keep base backups in the object store even if the Cluster or this schedule
  # is deleted; only the 30d retention policy in objectstore.yaml removes them.
  backupOwnerReference: none
  method: plugin
  cluster:
    name: postgres
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
    parameters:
      barmanObjectName: offsite-s3
