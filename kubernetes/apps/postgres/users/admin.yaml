# Personal superuser, e.g. for pgAdmin. Reaches every database. Also the
# cluster's first-start login and owner of the `admin` database (cluster.yaml).
apiVersion: postgresql.cnpg.io/v1
kind: DatabaseRole
metadata:
  name: admin
spec:
  cluster:
    name: postgres
  name: admin
  login: true
  superuser: true
  passwordSecret:
    name: admin-credentials
  databaseRoleReclaimPolicy: retain
