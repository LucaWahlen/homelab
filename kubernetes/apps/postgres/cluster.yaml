apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  # Two instances on one node: no protection against node or disk loss, but a
  # minor update replaces the replica first and then switches over to it,
  # instead of restarting the only primary. Pod anti-affinity is "preferred"
  # by default, so both still schedule on the single node.
  instances: 2
  primaryUpdateMethod: switchover
  # Renovate bumps minor versions and digests (custom manager in renovate.json).
  # Major upgrades are disabled there: they are a planned migration.
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6-system-bookworm@sha256:4ab49dc4f4bf4bcf583b6443e58bd410af3a69fd04c5e34e657edc7181e95086
  enableSuperuserAccess: false
  certificates:
    serverAltDNSNames:
      - postgres-rw.postgres.svc.cluster.local
  # Human logins live in users/; each app's database and login in
  # databases/<app>/. CNPG itself always creates an `app` database and login
  # at first start; keep it (its default metrics queries run there), but it
  # cannot log in over the network (see pg_hba).
  storage:
    storageClass: openebs-lvm
    size: 10Gi
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      memory: 2Gi
  postgresql:
    pg_hba:
      # First match wins. CNPG's own `app` login is unused; app logins reach
      # only the database with their own name; admin reaches every database.
      # All over TLS; anything else is rejected instead of falling through to
      # CNPG's default allow-all rule.
      - host all app all reject
      - hostssl sameuser all all scram-sha-256
      - hostssl all admin all scram-sha-256
      - host all all all reject
