apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  instances: 2
  primaryUpdateMethod: switchover
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6-system-bookworm@sha256:f8ef6a9da5e15aa7b7e777d6645e02bd37b272c150467c9a20ba0b0c89aea7fb
  enableSuperuserAccess: false
  certificates:
    serverAltDNSNames:
      - postgres-rw.postgres.svc.cluster.local
  bootstrap:
    initdb:
      database: admin
      owner: admin
      secret:
        name: admin-credentials
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: tommy-s3
  storage:
    storageClass: openebs-lvm
    size: 10Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi
  postgresql:
    pg_hba:
      - hostssl sameuser all all scram-sha-256
      - hostssl all admin all scram-sha-256
      - host all all all reject
