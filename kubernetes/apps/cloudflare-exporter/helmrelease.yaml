apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cloudflare-exporter
  namespace: cloudflare-exporter
spec:
  interval: 1h
  chart:
    spec:
      chart: cloudflare-exporter
      version: "0.2.3"
      sourceRef:
        kind: HelmRepository
        name: cloudflare-exporter
  values:
    image:
      # The chart's appVersion (0.0.16) predates R2 support. 0.2.3 added R2 but
      # its legacy client calls VerifyAPIToken() at startup, which 401s for
      # account-scoped API tokens. `latest` (master) uses cloudflare-go/v4,
      # supports account-scoped tokens and exposes the cloudflare_r2_* metrics.
      tag: latest
    # CF_API_TOKEN (Account Analytics:Read) and CF_ACCOUNTS are injected from
    # the SOPS-managed secret; edit it with sops to set the real values.
    secretRef: cloudflare-exporter
    env:
      - name: LOG_LEVEL
        value: "error"
      # R2 analytics are not real-time; polling less often keeps API usage low.
      - name: SCRAPE_INTERVAL
        value: "300"
    service:
      # This stack uses VictoriaMetrics CRs, not Prometheus-operator ServiceMonitors.
      addPrometheusScrapeAnnotation: false
    serviceMonitor:
      enabled: false
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
