apiVersion: v1
kind: ConfigMap
metadata:
  name: ntfy-config
data:
  server.yml: |
    # Public URL is needed both for generated links and for the iOS push
    # handshake, where ntfy forwards to upstream-base-url and the phone fetches
    # the message back from this origin.
    base-url: "https://ntfy.lucawahlen.com"
    listen-http: ":80"
    # Cloudflare terminates TLS in front of traefik, so trust X-Forwarded-*.
    behind-proxy: true
    cache-file: "/var/cache/ntfy/cache.db"
    auth-file: "/var/cache/ntfy/auth.db"
    # Attachments share the same PVC as the cache/auth DB and expire quickly;
    # the caps keep the (nominal 1Gi) volume bounded. ntfy owns this directory.
    attachment-cache-dir: "/var/cache/ntfy/attachments"
    attachment-total-size-limit: "1G"
    attachment-file-size-limit: "15M"
    attachment-expiry-duration: "3h"
    visitor-attachment-total-size-limit: "100M"
    visitor-attachment-daily-bandwidth-limit: "500M"
    # Dedicated, cluster-internal port: /metrics is then not served on the
    # public :80 listener (and never exposed through the ingress).
    metrics-listen-http: ":9090"
    # iOS instant notifications require forwarding through ntfy.sh (Apple push
    # only accepts the official ntfy.sh bundle).
    upstream-base-url: "https://ntfy.sh"
    auth-default-access: "deny-all"
    enable-login: true
    enable-signup: false
