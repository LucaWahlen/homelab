apiVersion: apps/v1
kind: Deployment
metadata:
  name: ntfy
  labels:
    app: ntfy
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ntfy
  template:
    metadata:
      labels:
        app: ntfy
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ntfy
          image: binwiederhier/ntfy:v2.33.1
          command:
            - ntfy
          args:
            - serve
          env:
            - name: NTFY_AUTH_USERS
              valueFrom:
                secretKeyRef:
                  name: ntfy-auth
                  key: NTFY_AUTH_USERS
            - name: NTFY_AUTH_TOKENS
              valueFrom:
                secretKeyRef:
                  name: ntfy-auth
                  key: NTFY_AUTH_TOKENS
            - name: NTFY_AUTH_ACCESS
              valueFrom:
                secretKeyRef:
                  name: ntfy-auth
                  key: NTFY_AUTH_ACCESS
          ports:
            - name: http
              containerPort: 80
            - name: metrics
              containerPort: 9090
          readinessProbe:
            httpGet:
              path: /v1/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /v1/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
              add: ["NET_BIND_SERVICE"]
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: data
              mountPath: /var/cache/ntfy
            - name: config
              mountPath: /etc/ntfy/server.yml
              subPath: server.yml
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: ntfy
        - name: config
          configMap:
            name: ntfy-config
        - name: tmp
          emptyDir: {}
