apiVersion: apps/v1
kind: Deployment
metadata:
  name: blocky
  labels:
    app: blocky
spec:
  replicas: 1
  # Pods on the host network can't share port 53, so the old pod must stop
  # before the new one starts.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: blocky
  template:
    metadata:
      labels:
        app: blocky
    spec:
      hostNetwork: true
      dnsPolicy: Default
      automountServiceAccountToken: false
      enableServiceLinks: false
      # Runs as root: binding :53 on the host network needs NET_BIND_SERVICE,
      # which a non-root process cannot gain with allowPrivilegeEscalation off.
      securityContext:
        runAsUser: 0
        runAsGroup: 0
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: blocky
          image: ghcr.io/0xerr0r/blocky:v0.35.0
          env:
            - name: BLOCKY_CONFIG_FILE
              value: /etc/blocky/config.yaml
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
              add: ["NET_BIND_SERVICE"]
          ports:
            - name: dns-udp
              containerPort: 53
              protocol: UDP
            - name: dns-tcp
              containerPort: 53
              protocol: TCP
            - name: http
              containerPort: 4000
          # Sends a DNS query that blocky answers itself, so a failing
          # upstream does not restart the pod.
          readinessProbe:
            exec:
              command: ["/app/blocky", "healthcheck"]
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            exec:
              command: ["/app/blocky", "healthcheck"]
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 20m
              memory: 128Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: config
              mountPath: /etc/blocky
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: blocky-config
