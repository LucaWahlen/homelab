apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: openebs-lvm
spec:
  interval: 1h
  chart:
    spec:
      chart: lvm-localpv
      version: "1.10.1"
      sourceRef:
        kind: HelmRepository
        name: openebs-lvm
  install:
    crds: Create
  upgrade:
    crds: CreateReplace
  values:
    analytics:
      enabled: false
    lvmController:
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
    lvmNode:
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
