apiVersion: v1
kind: Service
metadata:
  name: adguard-blocked
  labels:
    app: adguard-blocked
spec:
  # Intentionally no matching pods - Traefik answers mutating UI requests
  # (blocked by the IngressRoute) with 502 Service Unavailable
  selector:
    app: adguard-blocked
  ports:
    - name: http
      port: 80
      targetPort: 80