# Read-only UI: AdGuard has no native read-only mode, so every mutating HTTP
# method is blackholed at the proxy. Only the login POST is allowed, so users
# can still view the dashboard. Config changes go through Git; for the rare
# manual change, use kubectl port-forward (bypasses Traefik entirely).
apiVersion: traefik.containo.us/v1alpha1
kind: IngressRoute
metadata:
  name: adguard
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`adguard.lucawahlen.com`) && Method(`POST`, `PUT`, `PATCH`, `DELETE`) && !Path(`/login`)
      kind: Rule
      priority: 100
      services:
        - name: adguard-blocked
          port: 80
    - match: Host(`adguard.lucawahlen.com`)
      kind: Rule
      services:
        - name: adguard
          port: 80