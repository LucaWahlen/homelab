apiVersion: apps/v1
kind: Deployment
metadata:
  name: adguard
  labels:
    app: adguard
spec:
  # Recreate: the RWO PVC and hostPort 53 only allow a single active pod
  strategy:
    type: Recreate
  replicas: 1
  selector:
    matchLabels:
      app: adguard
  template:
    metadata:
      labels:
        app: adguard
    spec:
      initContainers:
        # GitOps: copy the sealed AdGuardHome.yaml into the PVC on every pod
        # start, so Git is always the source of truth for the config
        - name: config-seed
          image: busybox:1.37.0
          command:
            - sh
            - -c
            - cp /config-src/AdGuardHome.yaml /conf/AdGuardHome.yaml
          volumeMounts:
            - name: config
              mountPath: /config-src
              readOnly: true
            - name: data
              mountPath: /conf
              subPath: conf
      containers:
        - name: adguardhome
          image: adguard/adguardhome:v0.107.79
          ports:
            - name: dns-tcp
              containerPort: 53
              hostPort: 53
              protocol: TCP
            - name: dns-udp
              containerPort: 53
              hostPort: 53
              protocol: UDP
            - name: http
              containerPort: 80
          volumeMounts:
            - name: data
              mountPath: /opt/adguardhome/work
              subPath: work
            - name: data
              mountPath: /opt/adguardhome/conf
              subPath: conf
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
      volumes:
        - name: config
          secret:
            secretName: adguard-config
        - name: data
          persistentVolumeClaim:
            claimName: adguard