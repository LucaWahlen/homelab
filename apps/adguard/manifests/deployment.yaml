apiVersion: apps/v1
kind: Deployment
metadata:
  name: adguard
  labels:
    app: adguard
spec:
  # Recreate: the RWO PVC only allows a single active pod
  strategy:
    type: Recreate
  replicas: 1
  selector:
    matchLabels:
      app: adguard
  template:
    metadata:
      labels:
        app: adguard
    spec:
      # hostNetwork: AdGuard binds a real socket on the node IP for DNS.
      # Neither hostPort on the pod nor a LoadBalancer service can be used:
      # both create daddr-agnostic DNAT rules that hijack ALL of the node's
      # own port-53 traffic, killing node DNS whenever AdGuard is not Ready.
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      initContainers:
        # GitOps: copy the AdGuardHome.yaml into the PVC on every pod start,
        # so Git is always the source of truth for the config. The password
        # hash comes from the sealed secret and is merged into the placeholder
        - name: config-seed
          image: busybox:1.37.0
          env:
            - name: ADGUARD_PASSWORD_HASH
              valueFrom:
                secretKeyRef:
                  name: adguard-credentials
                  key: password-hash
          command:
            - sh
            - -c
            - sed "s|__ADGUARD_PASSWORD_HASH__|${ADGUARD_PASSWORD_HASH}|" /config-src/AdGuardHome.yaml > /conf/AdGuardHome.yaml
          volumeMounts:
            - name: config
              mountPath: /config-src
              readOnly: true
            - name: data
              mountPath: /conf
              subPath: conf
      containers:
        - name: adguardhome
          image: adguard/adguardhome:v0.107.79
          ports:
            - name: dns-tcp
              containerPort: 53
              protocol: TCP
            - name: dns-udp
              containerPort: 53
              protocol: UDP
            # 3000 instead of 80: with hostNetwork, kubelet's health probes
            # hit the node IP, where svclb DNATs port 80 into traefik
            - name: http
              containerPort: 3000
          volumeMounts:
            - name: data
              mountPath: /opt/adguardhome/work
              subPath: work
            - name: data
              mountPath: /opt/adguardhome/conf
              subPath: conf
              readOnly: true
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
      volumes:
        - name: config
          configMap:
            name: adguard-config
        - name: data
          persistentVolumeClaim:
            claimName: adguard