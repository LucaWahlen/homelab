# ArgoCD manages itself: this Application (discovered by the root app-of-apps)
# points at one kustomization that renders the argo-cd Helm chart and decrypts
# the sealed admin password via KSOPS. The Ansible bootstrap renders this exact
# path locally (with the local sops key) and applies it once; from then on
# ArgoCD syncs it itself.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/LucaWahlen/homelab.git
    targetRevision: main
    path: apps/argocd/manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 5
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 3m
  # ArgoCD generates server.secretkey on first startup and persists it into
  # argocd-secret. The rendered secret never contains that key, so without
  # this ignore every sync would delete it and force a regeneration.
  ignoreDifferences:
    - group: ""
      kind: Secret
      name: argocd-secret
      jsonPointers:
        - /data/server.secretkey
