apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: example-app
  namespace: argocd
spec:
  project: default
  source:
    # Replace with your actual repo URL (same as git_repo_url in
    # ansible/group_vars/all.yml).
    repoURL: git@github.com:youruser/homelab.git
    targetRevision: main
    path: apps/example-app/manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: example-app
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
