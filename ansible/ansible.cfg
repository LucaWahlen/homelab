[defaults]
inventory            = inventory/hosts.yml
roles_path           = roles
retry_files_enabled  = False
interpreter_python   = auto_silent

[ssh_connection]
# Trust the VM's host key on first contact and refuse a changed one. Keys are
# kept in ansible/known_hosts because ~/.ssh is mounted read-only in the
# devcontainer. After recreating the VM, drop the old key first:
#   ssh-keygen -f ansible/known_hosts -R 192.168.178.234
ssh_args = -C -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=known_hosts
