[defaults]
inventory            = inventory/hosts.yml
roles_path           = roles
retry_files_enabled  = False
interpreter_python   = auto_silent

[ssh_connection]
# Store host keys in ansible/known_hosts because ~/.ssh is mounted read-only in the devcontainer.
ssh_args = -C -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=known_hosts
