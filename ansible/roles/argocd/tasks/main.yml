---
- name: Create argocd namespace
  ansible.builtin.shell: |
    k3s kubectl create namespace argocd --dry-run=client -o yaml | k3s kubectl apply -f -
  changed_when: false

- name: Install ArgoCD
  ansible.builtin.command: >
    k3s kubectl apply -n argocd
    -f https://raw.githubusercontent.com/argoproj/argo-cd/{{ argocd_version }}/manifests/install.yaml
  register: argocd_install
  changed_when: "'created' in argocd_install.stdout or 'configured' in argocd_install.stdout"

- name: Wait for ArgoCD server to be available
  ansible.builtin.command: k3s kubectl -n argocd rollout status deployment/argocd-server --timeout=300s
  changed_when: false

# Every app carries its own Application manifest (apps/<name>/application.yaml)
# - git-tracked, plain, not templated from group_vars, each fully individual
# (namespace, sync policy, Helm vs kustomize - no conventions imposed). Each
# file is piped to kubectl as-is, nothing staged on the node. Re-running this
# role is what registers newly added Applications; every change after that is
# ArgoCD's automated sync, no Ansible involved.
- name: Find Application manifests
  ansible.builtin.find:
    paths: "{{ playbook_dir }}/../../apps"
    patterns: application.yaml
    recurse: true
  delegate_to: localhost
  register: app_manifests
  changed_when: false

- name: Apply Application manifests
  ansible.builtin.command:
    argv: [k3s, kubectl, apply, -f, -]
    stdin: "{{ lookup('ansible.builtin.file', item) }}"
  loop: "{{ app_manifests.files | map(attribute='path') | sort }}"
  loop_control:
    label: "{{ item | basename | dirname | basename }}"
  register: apps_apply
  changed_when: "'created' in apps_apply.stdout or 'configured' in apps_apply.stdout"

# The argocd Application (git-managed: apps/argocd/manifests/ - the server's Ingress and its server.insecure
# ConfigMap patch), like any other app. Nothing here applies that config
# directly - this just waits
# for ArgoCD to have actually synced it, since that's the one piece that
# can't be pure GitOps: a ConfigMap change doesn't restart the pod that
# reads it.
- name: Wait for the argocd Application to sync
  ansible.builtin.shell: |
    k3s kubectl -n argocd get application argocd -o jsonpath='{.status.sync.status}' 2>/dev/null || true
  register: argocd_config_sync
  changed_when: false
  retries: 18
  delay: 10
  until: argocd_config_sync.stdout == "Synced"

- name: Restart ArgoCD server to pick up insecure mode
  ansible.builtin.command: k3s kubectl -n argocd rollout restart deployment/argocd-server
  changed_when: true

- name: Wait for ArgoCD server to be available after restart
  ansible.builtin.command: k3s kubectl -n argocd rollout status deployment/argocd-server --timeout=300s
  changed_when: false
