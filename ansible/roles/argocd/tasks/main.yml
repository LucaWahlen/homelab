---
- name: Check whether ArgoCD already manages itself
  ansible.builtin.command: kubectl --namespace argocd get application argocd
  environment:
    KUBECONFIG: "{{ kubeconfig }}"
  register: argocd_self
  changed_when: false
  failed_when: false

- name: Create argocd namespace
  ansible.builtin.shell: |
    set -o pipefail
    kubectl create namespace argocd --dry-run=client -o yaml | kubectl apply -f -
  args:
    executable: /bin/bash
  environment:
    KUBECONFIG: "{{ kubeconfig }}"
  changed_when: false

- name: Push the age private key to the cluster
  ansible.builtin.shell: |
    set -o pipefail
    kubectl --namespace argocd create secret generic sops-age \
      --from-file=keys.txt={{ sops_age_key_file }} \
      --dry-run=client -o yaml | kubectl apply -f -
  args:
    executable: /bin/bash
  environment:
    KUBECONFIG: "{{ kubeconfig }}"
  no_log: true
  changed_when: true

# k3s ships Traefik as an async HelmChart, so its CRDs may not exist yet right after node Ready.
- name: Wait for the Traefik Middleware CRD
  ansible.builtin.command: kubectl wait --for=condition=Established --timeout=120s crd/middlewares.traefik.io
  environment:
    KUBECONFIG: "{{ kubeconfig }}"
  register: argocd_traefik_crd
  changed_when: false
  retries: 12
  delay: 10
  until: argocd_traefik_crd.rc == 0

# Server-side apply: the applicationsets CRD exceeds the client-side last-applied annotation limit.
- name: Install ArgoCD
  when: argocd_self.rc != 0
  ansible.builtin.shell: |
    set -o pipefail
    kustomize build --enable-alpha-plugins --enable-exec --enable-helm {{ repo_root }}/kubernetes/argocd \
      | kubectl apply --server-side --force-conflicts -f -
  args:
    executable: /bin/bash
  environment:
    KUBECONFIG: "{{ kubeconfig }}"
    SOPS_AGE_KEY_FILE: "{{ sops_age_key_file }}"
  changed_when: true

- name: Wait for the ArgoCD server
  ansible.builtin.command: kubectl --namespace argocd rollout status deployment/argocd-server --timeout=300s
  environment:
    KUBECONFIG: "{{ kubeconfig }}"
  changed_when: false

- name: Apply the root Application
  ansible.builtin.command: kubectl apply --filename {{ repo_root }}/kubernetes/root.yaml
  environment:
    KUBECONFIG: "{{ kubeconfig }}"
  register: argocd_root_apply
  changed_when: "'unchanged' not in argocd_root_apply.stdout"

- name: Wait for Applications to be Synced and Healthy
  ansible.builtin.command: >-
    kubectl --namespace argocd get application {{ item }}
    -o jsonpath='{.status.sync.status} {.status.health.status}'
  environment:
    KUBECONFIG: "{{ kubeconfig }}"
  register: argocd_app_status
  changed_when: false
  retries: 36
  delay: 10
  until: argocd_app_status.stdout == 'Synced Healthy'
  loop:
    - argocd
    - cloudflared
    - cert-manager
    - adguardhome
