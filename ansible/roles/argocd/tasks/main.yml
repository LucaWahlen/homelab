---
# ArgoCD bootstrap. Runs on the controller (localhost play in site.yml) against
# the kubeconfig the k3s role fetched. Pushes the age key, applies the argocd
# kustomization once (helm chart + sealed admin password rendered into one
# manifest, decrypted with the local sops key), applies the root app-of-apps.
# ArgoCD then syncs everything from Git itself. Re-running is safe.

- name: Point controller tooling at the cluster
  ansible.builtin.set_fact:
    argocd_env:
      KUBECONFIG: "{{ playbook_dir }}/../kubeconfig"

# --- Namespace + one-time migration ---------------------------------------------

- name: Detect the ArgoCD install state
  ansible.builtin.shell: |
    kubectl --namespace argocd get deployment argocd-server >/dev/null 2>&1 || { echo absent; exit 0; }
    managed=$(kubectl --namespace argocd get cm argocd-cm -o jsonpath='{.data.kustomize\.buildOptions}' 2>/dev/null || true)
    if [ -n "$managed" ]; then echo managed; else echo legacy; fi
  environment: "{{ argocd_env }}"
  register: argocd_state
  changed_when: false

# One-time migration off the old raw-manifest (install.yaml) install: our
# kustomize build can't cleanly adopt it, so the namespace gets rebuilt. App
# namespaces are untouched; the root app re-registers everything.
- name: Replace the legacy ArgoCD install
  when: argocd_state.stdout == 'legacy'
  ansible.builtin.shell: |
    kubectl delete namespace argocd --ignore-not-found --wait=true
    kubectl create namespace argocd --dry-run=client -o yaml | kubectl apply -f -
  environment: "{{ argocd_env }}"
  changed_when: true

- name: Create argocd namespace
  ansible.builtin.shell: |
    kubectl create namespace argocd --dry-run=client -o yaml | kubectl apply -f -
  environment: "{{ argocd_env }}"
  changed_when: false

# The repo-server mounts this (SOPS_AGE_KEY_FILE=/sops-age/keys.txt) to
# decrypt sealed secrets during kustomize builds. Applied rather than
# created-once so an age key rotation propagates on the next run.
- name: Push the age private key to the cluster
  ansible.builtin.shell: |
    kubectl --namespace argocd create secret generic sops-age \
      --from-file=keys.txt={{ sops_age_key_file }} \
      --dry-run=client -o yaml | kubectl apply -f -
  environment: "{{ argocd_env }}"
  no_log: true
  changed_when: true

# --- Bootstrap + handover ----------------------------------------------------------

# Renders apps/argocd/manifests (helm chart + sealed admin secret) into one
# manifest and applies it - decrypted with the local sops key during the
# build. Skipped once ArgoCD manages itself; re-runs then only refresh the
# age key above.
# Applied server-side: the applicationsets CRD alone exceeds the 256 KiB
# annotation limit, which client-side apply trips over because it stashes the
# full manifest in the last-applied-configuration annotation. force-conflicts
# keeps re-runs over a partial/legacy install safe.
- name: Bootstrap-apply ArgoCD via kustomize
  when: argocd_state.stdout != 'managed'
  ansible.builtin.shell: |
    kustomize build --enable-alpha-plugins --enable-exec --enable-helm \
      {{ playbook_dir }}/../../apps/argocd/manifests | kubectl apply --server-side --force-conflicts -f -
  environment:
    KUBECONFIG: "{{ argocd_env.KUBECONFIG }}"
    SOPS_AGE_KEY_FILE: "{{ sops_age_key_file }}"
  changed_when: true

- name: Apply the root Application (app-of-apps entry point)
  ansible.builtin.command:
    argv: [kubectl, apply, --filename, "{{ playbook_dir }}/../../apps/root.yaml"]
  environment: "{{ argocd_env }}"
  register: root_apply
  changed_when: "'created' in root_apply.stdout or 'configured' in root_apply.stdout"

- name: Wait for the self-managed argocd Application to sync
  ansible.builtin.shell: |
    kubectl --namespace argocd get application argocd -o jsonpath='{.status.sync.status} {.status.health.status}' 2>/dev/null || true
  environment: "{{ argocd_env }}"
  register: argocd_app_status
  changed_when: false
  retries: 36
  delay: 10
  until: "'Synced' in argocd_app_status.stdout and 'Healthy' in argocd_app_status.stdout"

- name: Wait for the cloudflared Application to sync
  ansible.builtin.shell: |
    kubectl --namespace argocd get application cloudflared -o jsonpath='{.status.sync.status} {.status.health.status}' 2>/dev/null || true
  environment: "{{ argocd_env }}"
  register: cloudflared_app_status
  changed_when: false
  retries: 36
  delay: 10
  until: "'Synced' in cloudflared_app_status.stdout and 'Healthy' in cloudflared_app_status.stdout"

- name: Wait for the ArgoCD server to be available
  ansible.builtin.command: kubectl --namespace argocd rollout status deployment/argocd-server --timeout=300s
  environment: "{{ argocd_env }}"
  changed_when: false
