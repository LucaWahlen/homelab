---
- name: Read installed k3s version
  ansible.builtin.command: k3s --version
  register: k3s_installed
  changed_when: false
  failed_when: false

# All persistent data lives on the OpenEBS LVM data disk; the small OS disk is
# reserved for the OS and container images. Disable the bundled local-path
# provisioner so PVCs cannot silently consume the OS disk. A fresh install reads
# this on first start; an existing install picks it up on its next k3s restart.
- name: Ensure the k3s config directory exists
  ansible.builtin.file:
    path: /etc/rancher/k3s
    state: directory
    mode: "0700"

- name: Configure k3s
  ansible.builtin.copy:
    dest: /etc/rancher/k3s/config.yaml
    mode: "0600"
    content: |
      disable:
        - local-storage

- name: Install or upgrade k3s
  when: k3s_version not in k3s_installed.stdout | default('')
  block:
    - name: Download k3s install script
      ansible.builtin.get_url:
        url: https://raw.githubusercontent.com/k3s-io/k3s/{{ k3s_version | urlencode }}/install.sh
        dest: /tmp/k3s-install-{{ k3s_version }}.sh
        mode: "0755"

    - name: Run k3s install script
      ansible.builtin.command: /tmp/k3s-install-{{ k3s_version }}.sh
      environment:
        INSTALL_K3S_VERSION: "{{ k3s_version }}"
      changed_when: true

- name: Wait for k3s node to be Ready
  ansible.builtin.command: k3s kubectl wait --for=condition=Ready node --all --timeout=180s
  changed_when: false
  register: k3s_ready
  retries: 5
  delay: 10
  until: k3s_ready.rc == 0

- name: Read kubeconfig
  ansible.builtin.slurp:
    src: /etc/rancher/k3s/k3s.yaml
  register: k3s_kubeconfig

- name: Write local kubeconfig
  become: false
  delegate_to: localhost
  ansible.builtin.copy:
    content: "{{ k3s_kubeconfig.content | b64decode | replace('127.0.0.1', ansible_host) }}"
    dest: "{{ kubeconfig }}"
    mode: "0600"
