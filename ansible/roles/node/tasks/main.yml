---
- name: Install QEMU guest agent
  ansible.builtin.apt:
    name: qemu-guest-agent
    update_cache: true
    cache_valid_time: 3600

- name: Start QEMU guest agent
  ansible.builtin.systemd_service:
    name: qemu-guest-agent
    state: started

- name: Install LVM tools
  ansible.builtin.apt:
    name: lvm2

- name: Check for the OpenEBS volume group
  ansible.builtin.command: vgs {{ lvm_volume_group }}
  register: lvm_vg
  changed_when: false
  failed_when: false

- name: Create the OpenEBS volume group on the data disk
  ansible.builtin.command: vgcreate {{ lvm_volume_group }} {{ lvm_data_disk }}
  when: lvm_vg.rc != 0
  changed_when: true
