---
- name: Install node packages
  ansible.builtin.apt:
    name:
      - qemu-guest-agent
      - lvm2
    update_cache: true
    cache_valid_time: 3600

# Static systemd unit triggered by udev; cannot be enabled.
- name: Start QEMU guest agent
  ansible.builtin.systemd_service:
    name: qemu-guest-agent
    state: started

- name: Ensure the OpenEBS volume group spans the data disk
  community.general.lvg:
    vg: "{{ lvm_volume_group }}"
    pvs: "{{ lvm_data_disk }}"
    pvresize: true
