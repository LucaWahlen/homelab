---
- name: Wait for VM to finish booting (cloud-init + sshd)
  hosts: k3s_server
  gather_facts: false
  tasks:
    - name: Wait for SSH connection
      ansible.builtin.wait_for_connection:
        connect_timeout: 10
        sleep: 5
        timeout: 300

- name: Bootstrap k3s
  hosts: k3s_server
  become: true
  roles:
    - k3s

- name: Bootstrap ArgoCD
  hosts: localhost
  connection: local
  gather_facts: false
  roles:
    - argocd
